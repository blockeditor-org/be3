name: Android builds

# A closed pull request's build is one the launcher on Android has no more use
# for, so its slot in the be3-ci storage zone goes (ci.yml's publish-android
# says how the slots are laid out), and is purged from the CDN, which would
# otherwise go on serving it for a month. A pull request from a fork never had
# one.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  remove:
    name: remove the Android build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Delete its slot
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "AccessKey: $BUNNY_STORAGE_KEY" \
            "https://storage.bunnycdn.com/be3-ci/android/pr-$NUMBER/")"
          case "$status" in
            2*|404) echo "Deleted android/pr-$NUMBER/ ($status)" ;;
            *) echo "Deleting android/pr-$NUMBER/ answered $status" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 3 --output /dev/null \
            --request POST \
            --header "AccessKey: $BUNNY_API_KEY" \
            --get --data-urlencode "url=https://be3-ci.b-cdn.net/android/pr-$NUMBER/*" \
            https://api.bunny.net/purge
