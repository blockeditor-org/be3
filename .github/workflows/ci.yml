name: CI

on:
  # Every branch runs on its pushes, and a pull request's run is the run of its
  # branch. A push runs this file as the branch has it, where a pull_request
  # run would take it from GitHub's merge of the pull request into main: a
  # pull request based on an older main would run main's steps, with main's
  # secrets, over its own scripts, so every change to CI broke the pull
  # requests that had not merged it yet. What is merged is still checked as it
  # will land, by merge_group, so the merge queue's own branches are left to
  # that. Opening a pull request pushes nothing, so pull-requests.yml starts a
  # run of the branch for it. A pull request from a fork gets no run: its
  # branch is not here to push to, and a fork's run would have no secrets to
  # build with.
  #
  # Running on main is what gives every other run a cache to restore from. A
  # GitHub Actions cache written on a branch can only be read back from that
  # branch, so until something ran here, every entry these jobs wrote was one
  # only the branch that wrote it could ever use.
  push:
    branches-ignore: ['gh-readonly-queue/**']
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch run is work on a commit nobody is waiting for any more.
  # A run on main is not: it is the one that fills the caches, and a merge
  # queue run is what a merge is waiting on, so neither is cancelled. Nor is
  # the run pull-requests.yml starts, which is the same commit as the push run
  # it would cancel, and waits for it instead.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The token for Namespace's remote execution (guides/build_server.md), which
  # runs every buck2 action.
  BE3_BUILD_SERVER_KEY: ${{ secrets.BE3_NAMESPACE_TOKEN }}

# One job does the work: ci is ./scripts/buck run //:ci, which verifies, builds
# the Android app and launcher, and on a pull request renders the paint
# previews, and uploads what each of those produced. It runs the pull
# request's code, so it holds no credentials beyond Namespace's token and the
# Android keystore, both of which a build can already read.
# The jobs after it each run nothing from the pull request and hold the one
# credential they write with: autofix pushes the fixes, publish-paint-previews
# comments with the previews, publish-android puts the Android build where the
# launcher on Android finds it, and CI OK is the gate. Everything builds on the
# build server, so what a runner needs is buck2 and whatever runs here rather
# than there.
jobs:
  # ./scripts/buck run //:ci, the way a person runs it: the lint pass and the
  # tests on the build server, and the plugin tests here, since they read and
  # write the accepted paintings in snapshots/. On a branch it fixes and
  # accepts instead of only reporting, and anything that leaves the checkout
  # changed is uploaded as a patch for the autofix job to push, and fails this
  # job. On main and in the merge queue nothing may be written: they are
  # asking whether what is there is right, and a fix on either has nowhere to
  # go.
  #
  # Accepting a painting that changed, or one that is new, is on purpose:
  # the commit that carries it is what a reviewer looks at in Paint review.
  #
  # The Android builds are signed on a worker with CI's keystore, the secret
  # ANDROID_CI_KEYSTORE_BASE64, so successive CI builds install as updates
  # over one another. The plugins are in each, since an APK has nowhere else
  # to find them.
  #
  # The paint previews are every painting a pull request changes, drawn
  # before, after, and with what changed marked, for one comment on the pull
  # request that each run edits rather than adding to. The paintings compared
  # are the ones committed on the head, so a painting the autofix job accepts
  # shows up in the run its commit starts. A branch with no open pull request
  # has nowhere to comment, so it has no previews.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.outputs.outputs.android }}
      previews: ${{ steps.outputs.outputs.previews }}
      fixes: ${{ steps.branch.outputs.fixes }}
      pr: ${{ steps.branch.outputs.number }}
    steps:
      # The whole history, since what a pull request changed in its paintings
      # is measured from where it left its base rather than from wherever the
      # base is now.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Whether this run may fix what it finds, which is any branch's, and the
      # open pull request the branch is the head of, if it has one: its number
      # names its comment and its Android build, and its base is what its
      # paintings are measured from. The token is given to this step alone.
      - name: Find the pull request
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          FIXES: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "fixes=$FIXES" >> "$GITHUB_OUTPUT"
          if [ "$FIXES" = true ]; then
            gh api --method GET "repos/$REPOSITORY/pulls" -f state=open -f head="$OWNER:$BRANCH" \
              --jq '.[0] // empty | "number=\(.number)\nbase=\(.base.sha)"' >> "$GITHUB_OUTPUT"
          fi

      # The workflows are linted before anything from the pull request has
      # run. Everything a job installs before it builds anything is trusted
      # completely, so the rules about how those are named - a commit for a
      # third-party action, a tag only for GitHub's own, no expansion of an
      # input into a shell script - are worth more as a check than as a
      # convention. .github/zizmor.yml is where the policy is written.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: zizmor@1.30.1

      # The token is what lets zizmor check that each pinned commit is really in
      # the repository it is attributed to, which is the half of pinning that
      # reading the workflow cannot tell you. It is given to this step alone.
      - name: Lint the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml .github/workflows .github/actions

      # A plugin test that paints through the gpu abi opens the software
      # Vulkan device.
      - name: Install system dependencies
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan1 mesa-vulkan-drivers

      - uses: ./.github/actions/buck2
        if: ${{ !cancelled() }}

      # Where buck/android:ci-keystore finds it, for :android-dist to sign with.
      - name: Write CI's Android keystore
        if: ${{ !cancelled() }}
        env:
          ANDROID_CI_KEYSTORE_BASE64: ${{ secrets.ANDROID_CI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_CI_KEYSTORE_BASE64" ]; then
            (umask 077 && printf '%s' "$ANDROID_CI_KEYSTORE_BASE64" > buck/android/ci-keystore.base64)
          fi

      - name: Run //:ci
        if: ${{ !cancelled() }}
        env:
          CHECK: ${{ steps.branch.outputs.fixes != 'true' }}
          PREVIEWS: ${{ steps.branch.outputs.number != '' }}
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          set -- --android dist/android
          if [ "$CHECK" = true ]; then
            set -- "$@" --check
          fi
          if [ "$PREVIEWS" = true ]; then
            set -- "$@" --previews "$BASE" "$RUNNER_TEMP/previews"
          fi
          ./scripts/buck run //:ci -- "$@"

      # What the jobs after this one take: each only when it was made whole.
      - name: Note what was made
        id: outputs
        if: ${{ !cancelled() }}
        run: |
          if [ -f dist/android/block-app.apk ] && [ -f dist/android/be-launcher.apk ]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$RUNNER_TEMP/previews/comment.md" ]; then
            echo 'previews=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ !cancelled() && steps.outputs.outputs.android == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/android
          retention-days: 14

      - if: ${{ !cancelled() && steps.outputs.outputs.previews == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews
          retention-days: 1

      # Everything a fix can do shows up in git: an edited file, a moved one,
      # and an untracked one such as a painting that was accepted for the first
      # time, which is why this stages the whole tree before it asks. What is
      # ignored stays out, which is everything a build leaves behind, the
      # Android builds in dist/ among them.
      #
      # This runs whether or not verification passed. A run that failed on one
      # test has still accepted the paintings the others made, and a run that
      # failed on a clippy warning it could not fix has still formatted the
      # rest, and both of those are worth the push.
      #
      # The keystore is deleted first rather than left to .gitignore, because
      # the .gitignore is the pull request's: one based on a main from before
      # the keystore was ignored would stage it, and one that already tracks it
      # would stage the secret's new value. Deleted, the most it can stage is
      # its removal.
      - name: Collect what verification changed
        id: collect
        if: ${{ !cancelled() && steps.branch.outputs.fixes == 'true' }}
        run: |
          rm -f buck/android/ci-keystore.base64
          git add --all
          if git diff --cached --quiet; then
            echo 'Verification changed nothing.'
            echo 'dirty=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/autofix"
          git diff --cached --binary > "$RUNNER_TEMP/autofix/autofix.patch"
          echo 'dirty=true' >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: autofix
          path: ${{ runner.temp }}/autofix/autofix.patch
          retention-days: 1

      # A branch whose fixes changed something is not the branch that passed:
      # the one that passes is the commit the autofix job pushes, and CI runs
      # again on that.
      - name: Fail because verification changed the checkout
        if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        run: |
          echo '::error::Verification changed the checkout. The autofix job pushes the change to this branch when it can; otherwise run ./scripts/buck run //:verify and commit what it changes.'
          exit 1

  # A branch's verification fixes what it can and accepts what the tests
  # paint, and if that changed anything the ci job uploads the change as a
  # patch and fails. This pushes it to the branch as one commit, and the CI
  # run that commit starts is the one that can pass.
  #
  # It is the one job here that writes to the repository, so it is the one job
  # that runs nothing from the pull request: it applies patches, which are data
  # to git, and pushes. The job that made them ran the pull request's code
  # with no credential but the build server's key.
  #
  # The push is made as a GitHub App rather than with GITHUB_TOKEN,
  # because a push made with GITHUB_TOKEN starts no workflow, and a fixed head
  # nobody runs CI on is a branch that can never pass.
  #
  # The gate below waits for this but does not judge it. Whether the pull
  # request passes was decided by ci; this only decides whether its author
  # has to push the fix themselves.
  autofix:
    name: push autofixes
    if: >-
      !cancelled() &&
      needs.ci.outputs.fixes == 'true' &&
      contains(needs.*.result, 'failure')
    needs: [ci]
    runs-on: ubuntu-24.04
    steps:
      # A run that failed without changing anything uploaded nothing, so
      # finding no patch here is the ordinary way for this job to have nothing
      # to do.
      - uses: actions/download-artifact@v8
        with:
          pattern: autofix
          path: ${{ runner.temp }}/autofix
          merge-multiple: true

      - name: Look for patches
        id: patches
        run: |
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/autofix/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'Nothing to push: verification changed nothing in the checkout.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.patches.outputs.found == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The same head the ci job checked out, so that the patch applies to the
      # tree it was made from. The token is kept out of .git/config and handed
      # to the one command that needs it.
      - uses: actions/checkout@v7
        if: steps.patches.outputs.found == 'true'
        with:
          persist-credentials: false

      # A patch that will not apply stops the push rather than being pushed
      # half-applied.
      #
      # A head that is already this job's own commit and still needed fixing
      # is a fix that does not settle, and pushing again would only start the
      # same run again, so that is where it stops and a person looks. The
      # commit is recognised by its author and its message together, so that
      # anything else the app pushes is not mistaken for it.
      #
      # The push is to the branch by name and never forced. If the author
      # pushed while this ran, their commit wins, and the run their push
      # started has fixes of its own to make.
      - name: Push the fixes to the pull request
        if: steps.patches.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$APP_SLUG[bot]"
          message='style: apply the fixes from ./scripts/buck run //:verify'
          if [ "$(git log -1 --format=%an)" = "$author" ] && [ "$(git log -1 --format=%s)" = "$message" ]; then
            echo "::error::The head is already an autofix commit and verification still changed it. Run ./scripts/buck run //:verify and commit what it changes."
            exit 1
          fi

          git config user.name "$author"
          git config user.email "$author@users.noreply.github.com"
          for patch in "$RUNNER_TEMP"/autofix/*.patch; do
            git apply --index "$patch"
          done
          git commit --quiet --message "$message"
          git show --stat HEAD

          git push "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

  # The images go to the be3-ci Bunny storage zone as paint-previews/<hash>.png,
  # named by the SHA-256 of their bytes, and the comment links them through the
  # zone's CDN. A name that is its content's hash never changes what it points
  # at, so an upload never has to replace anything a comment already links,
  # and an image two runs both drew is stored once. The storage key is given to
  # the upload step alone. What the artifact holds was made by the pull
  # request's code, so it is only ever data here: files to upload and text to
  # post.
  #
  # A pull request that no longer changes any painting has its comment edited
  # to say so; one that never did gets no comment.
  publish-paint-previews:
    name: comment paint previews
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.outputs.previews == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews

      - name: Upload the previews
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for image in "$RUNNER_TEMP"/previews/*.png; do
            curl --fail --silent --show-error --retry 3 --output /dev/null \
              --request PUT \
              --header "AccessKey: $BUNNY_STORAGE_KEY" \
              --header 'Content-Type: image/png' \
              --upload-file "$image" \
              "https://storage.bunnycdn.com/be3-ci/paint-previews/$(basename "$image")"
          done

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ needs.ci.outputs.pr }}
        run: |
          set -euo pipefail
          previews="$RUNNER_TEMP/previews"
          comment="$RUNNER_TEMP/comment.md"
          sed 's|PREVIEW_ROOT|https://be3-ci.b-cdn.net/paint-previews|g' "$previews/comment.md" > "$comment"

          existing="$(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- paint-previews -->"))) | .id' |
            sed -n 1p)"

          if [ -n "$existing" ]; then
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" --input - > /dev/null
          elif compgen -G "$previews/*.png" > /dev/null; then
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method POST "repos/$REPOSITORY/issues/$NUMBER/comments" --input - > /dev/null
          else
            echo 'The pull request changes no paintings.'
          fi

  # The launcher on Android (crates/be-launcher) installs these APKs: the app
  # and the launcher, both signed with CI's keystore. Each goes to the be3-ci
  # Bunny storage zone under android/<slot>/, where the slot is pr-<number> or
  # main: one build a slot, which the next replaces. Each APK is named by the
  # SHA-256 of its bytes, <hash>.apk, so one the slot already holds is not
  # uploaded again, and nor does the launcher download or install it again.
  # build.json, uploaded after them, names them: the commit, and the hash and
  # size of the app and of the launcher. The CDN keeps a file for a month
  # whatever its query string, so build.json is purged from it with the Bunny
  # API key once it is uploaded. The APKs it no longer names are deleted after
  # it. android-builds.yml deletes a closed pull request's slot.
  # Only main and branches with an open pull request have one. As with the paint
  # previews, the storage key is given to the upload step alone, and what the
  # artifacts hold is only data here.
  #
  # Not one of CI OK's needs: a build the launcher cannot fetch does not stop
  # a merge.
  publish-android:
    name: publish the Android build
    needs: [ci]
    if: >-
      !cancelled() &&
      needs.ci.outputs.android == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.ci.outputs.pr != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: ${{ runner.temp }}/android

      - name: Upload it
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          SLOT: ${{ needs.ci.outputs.pr != '' && format('pr-{0}', needs.ci.outputs.pr) || 'main' }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          android="$RUNNER_TEMP/android"
          objects="$RUNNER_TEMP/objects"
          mkdir -p "$objects"
          store="https://storage.bunnycdn.com/be3-ci/android/$SLOT"

          object() {
            hash="$(sha256sum "$1" | cut -c1-64)"
            cp "$1" "$objects/$hash.apk"
            jq -n --arg hash "$hash" --argjson size "$(stat -c %s "$1")" '{hash: $hash, size: $size}'
          }

          jq -n \
            --arg commit "$COMMIT" \
            --argjson app "$(object "$android/block-app.apk")" \
            --argjson launcher "$(object "$android/be-launcher.apk")" \
            '{commit: $commit, app: $app, launcher: $launcher}' > "$RUNNER_TEMP/build.json"

          present="$(curl --fail --silent --show-error --retry 3 \
            --header "AccessKey: $BUNNY_STORAGE_KEY" "$store/" |
            jq -r '.[] | select(.IsDirectory | not) | .ObjectName')" || present=''

          for object in "$objects"/*.apk; do
            name="$(basename "$object")"
            if ! grep -qxF "$name" <<< "$present"; then
              curl --fail --silent --show-error --retry 3 --output /dev/null \
                --request PUT \
                --header "AccessKey: $BUNNY_STORAGE_KEY" \
                --header 'Content-Type: application/vnd.android.package-archive' \
                --upload-file "$object" \
                "$store/$name"
            fi
          done

          curl --fail --silent --show-error --retry 3 --output /dev/null \
            --request PUT \
            --header "AccessKey: $BUNNY_STORAGE_KEY" \
            --header 'Content-Type: application/json' \
            --upload-file "$RUNNER_TEMP/build.json" \
            "$store/build.json"

          curl --fail --silent --show-error --retry 3 --output /dev/null \
            --request POST \
            --header "AccessKey: $BUNNY_API_KEY" \
            --get --data-urlencode "url=https://be3-ci.b-cdn.net/android/$SLOT/build.json" \
            https://api.bunny.net/purge

          wanted="$(ls "$objects")"
          while IFS= read -r name; do
            if [ -n "$name" ] && [ "$name" != build.json ] && ! grep -qxF "$name" <<< "$wanted"; then
              curl --fail --silent --show-error --retry 3 --output /dev/null \
                --request DELETE \
                --header "AccessKey: $BUNNY_STORAGE_KEY" \
                "$store/$name"
            fi
          done <<< "$present"

  # The one check the ruleset on main requires, on the pull request and on
  # the merge group GitHub's merge queue builds from it. Every job it names in
  # needs other than autofix has to pass, so requiring this one name requires
  # all of them, and adding a job to the check below extends the gate without
  # anyone editing the ruleset.
  #
  # It waits for autofix without judging it. Waiting means that by the time
  # this fails, the push of the fixes has already happened, and CI has
  # started again on it.
  #
  # always(), and nothing else. A job whose `if` is false does not run, and
  # GitHub reports what did not run as a skipped check run, which a required
  # status check accepts the same way it accepts a pass. A condition here that
  # can be false is therefore a gate that opens itself: this job spent a while
  # carrying `github.event_name != 'pull_request'` and resolved to skipped on
  # every pull request, which satisfied the rule without reading a single one
  # of its needs. always() is what makes it run after the needs finish
  # whatever they did, so that the step below is the thing that decides.
  ci-ok:
    name: 'CI OK'
    if: always()
    needs: [ci, autofix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed
        if: needs.ci.result != 'success'
        run: exit 1
