name: CI

on:
  # Running on main is what gives every other run a cache to restore from. A
  # GitHub Actions cache written on a branch can only be read back from that
  # branch and from the runs of pull requests based on it, so until something
  # ran here, every entry these jobs wrote was one only the branch that wrote
  # it could ever use.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is work on a commit nobody is waiting for any
  # more. A run on main is not: it is the one that fills the caches, and a merge
  # queue run is what a merge is waiting on, so neither is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The API gateway's header, behind which the waker names the hosts of
  # Namespace's remote execution (guides/build_server.md), which runs every
  # buck2 action. A pull request from a fork sees an empty value, and
  # ./scripts/buck says so rather than building.
  BE3_AUTHORIZATION: ${{ secrets.BE3_TRACKER_AUTHORIZATION }}

# One job does the work: ci is ./scripts/ci, which verifies and on a pull
# request renders the paint previews, and uploads what each of those produced.
# It builds nothing for a device: the build helper builds the apps when
# be-launcher asks (guides/build_server.md), so CI downloads as little from the
# build server as it can. It is also the gate: ci is
# the one check the ruleset on main requires, on the pull request and on the
# merge group GitHub's merge queue builds from it. It runs the pull
# request's code, so it holds no credential beyond the API gateway's header,
# which a build can already read. This workflow also runs on the code of
# pull requests opened before it changed, so it hands that code no secret it
# did not hand it before, and writes none into the checkout.
# The jobs after it each run nothing from the pull request and hold the one
# credential they write with: autofix pushes the fixes, publish-summary
# comments with the summary, publish-bootstrap uploads a new release of
# crates/bootstrap. Everything builds on the
# build server, so what a runner needs is buck2 and whatever runs here rather
# than there.
jobs:
  # ./scripts/ci, the way a person runs it: one buck2 command builds the
  # fixes and runs the lints, the tests and the plugin tests on the build
  # server, and the script writes what they changed into the checkout, the
  # accepted paintings in each crate's snapshots/ among them. On a pull request it fixes and
  # accepts instead of only reporting, and anything that leaves the checkout
  # changed is uploaded as a patch for the autofix job to push, and fails this
  # job. Everywhere else nothing may be written: main, the merge queue and a
  # manual run are asking whether what is there is right, and a fix on any of
  # them has nowhere to go.
  #
  # Accepting a painting that changed, or one that is new, is on purpose:
  # the commit that carries it is what a reviewer looks at in the paintings on
  # the pull request's summary comment.
  #
  # The paint previews are every painting a pull request changes, drawn
  # before, after, and with what changed marked, for one comment on the pull
  # request that each run edits rather than adding to, which also counts the
  # lines of Rust the pull request adds and removes outside its tests. The paintings
  # compared are the ones committed on the head, so a painting the autofix job
  # accepts shows up in the run its commit starts. A fork's run has no Namespace
  # token to build with and no token to comment with, so it has no previews.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    outputs:
      bootstrap: ${{ steps.outputs.outputs.bootstrap }}
      previews: ${{ steps.outputs.outputs.previews }}
    steps:
      # A pull request is checked out at its head rather than at the merge
      # GitHub makes of it, because what this job fixes is pushed back to that
      # head and has to apply there. What is merged is checked again as it will
      # land: GitHub's merge queue runs this workflow on the merge group's
      # commit, which is the pull request on top of main as it will be. The
      # whole history, since what a pull request changed in its paintings is
      # measured from where it left its base rather than from wherever the base
      # is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workflows are linted before anything from the pull request has
      # run. Everything a job installs before it builds anything is trusted
      # completely, so the rules about how those are named - a commit for a
      # third-party action, a tag only for GitHub's own, no expansion of an
      # input into a shell script - are worth more as a check than as a
      # convention. .github/zizmor.yml is where the policy is written.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: zizmor@1.30.1

      # The token is what lets zizmor check that each pinned commit is really in
      # the repository it is attributed to, which is the half of pinning that
      # reading the workflow cannot tell you. It is given to this step alone.
      - name: Lint the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml .github/workflows .github/actions

      - uses: ./.github/actions/buck2
        if: ${{ !cancelled() }}

      # What draws the browser paintings in the previews: Playwright, driving
      # the Google Chrome the runner image already has. Downloading Playwright's
      # own Chromium, and its system packages with apt, took minutes and
      # sometimes stalled for more than ten; the Python package alone is one
      # wheel. Before and after are drawn by the same browser in the same run,
      # so which Chrome it is does not change what the previews compare. An
      # image without Chrome falls back to the download.
      - name: Install the browser preview runtime
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('crates/browser-rasterizer/requirements.txt') != '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-rasterizer"
          "$RUNNER_TEMP/browser-rasterizer/bin/pip" install --quiet -r crates/browser-rasterizer/requirements.txt
          echo "BE3_PLAYWRIGHT_PYTHON=$RUNNER_TEMP/browser-rasterizer/bin/python" >> "$GITHUB_ENV"
          if chrome="$(command -v google-chrome)"; then
            echo "BE3_CHROME=$chrome" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/browser-rasterizer/bin/python" -m playwright install --with-deps chromium
          fi

      # What the browser tests (web_drive_test in buck/app/drive.bzl) drive
      # Chrome with, on this runner since the workers have no browser:
      # Playwright's Node package, with the Google Chrome the runner image
      # already has, as the previews use it. An image without Chrome falls back
      # to Playwright's own Chromium. A pull request older than the browser
      # tests has no buck/app/web-test.mjs and skips this.
      - name: Install the browser tests' runtime
        if: ${{ !cancelled() && hashFiles('buck/app/web-test.mjs') != '' }}
        run: |
          npm install --global --no-audit --no-fund playwright@1.63.0
          if chrome="$(command -v google-chrome)"; then
            echo "BE3_CHROME=$chrome" >> "$GITHUB_ENV"
          else
            npx --yes playwright@1.63.0 install --with-deps chromium
          fi

      - name: Run ./scripts/ci
        if: ${{ !cancelled() }}
        env:
          CHECK: ${{ github.event_name != 'pull_request' }}
          PREVIEWS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          BOOTSTRAP: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set --
          if [ "$CHECK" = true ]; then
            set -- "$@" --check
          fi
          if [ "$PREVIEWS" = true ]; then
            set -- "$@" --previews "$BASE" "$RUNNER_TEMP/previews"
          fi
          if [ "$BOOTSTRAP" = true ]; then
            set -- "$@" --bootstrap "$RUNNER_TEMP/bootstrap"
          fi
          ./scripts/ci "$@"

      # What the jobs after this one take: each only when it was made whole.
      - name: Note what was made
        id: outputs
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/previews/comment.md" ]; then
            echo 'previews=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(ls -A "$RUNNER_TEMP/bootstrap" 2> /dev/null)" ]; then
            echo 'bootstrap=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ !cancelled() && steps.outputs.outputs.bootstrap == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap
          path: ${{ runner.temp }}/bootstrap
          retention-days: 1

      - if: ${{ !cancelled() && steps.outputs.outputs.previews == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews
          retention-days: 1

      # Everything a fix can do shows up in git: an edited file, a moved one,
      # and an untracked one such as a painting that was accepted for the first
      # time, which is why this stages the whole tree before it asks. What is
      # ignored stays out, which is everything a build leaves behind.
      #
      # This runs whether or not verification passed. A run that failed on one
      # test has still accepted the paintings the others made, and a run that
      # failed to compile has still formatted the
      # rest, and both of those are worth the push.
      #
      # The files a credential can be in are deleted first rather than left to
      # .gitignore, because the .gitignore is the pull request's, and one based
      # on an older main may not ignore them: .buckconfig.local, where
      # ./scripts/buck writes the build server's header, the scripts' key
      # files, and the keystore older workflows wrote. Deleted, the most one
      # can stage is its removal.
      - name: Collect what verification changed
        id: collect
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          rm -f .buckconfig.local .gateway-authorization .build-server-key.* buck/android/ci-keystore.base64
          git add --all
          if git diff --cached --quiet; then
            echo 'Verification changed nothing.'
            echo 'dirty=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/autofix"
          git diff --cached --binary > "$RUNNER_TEMP/autofix/autofix.patch"
          echo 'dirty=true' >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: autofix
          path: ${{ runner.temp }}/autofix/autofix.patch
          retention-days: 1

      # A pull request whose fixes changed something is not the pull request
      # that passed: the one that passes is the commit the autofix job pushes,
      # and CI runs again on that.
      - name: Fail because verification changed the checkout
        if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        run: |
          echo '::error::Verification changed the checkout. The autofix job pushes the change to this branch when it can; otherwise run ./scripts/verify and commit what it changes.'
          exit 1

  # A pull request's verification fixes what it can and accepts what the tests
  # paint, and if that changed anything the ci job uploads the change as a
  # patch and fails. This pushes it to the pull request's branch as one commit, and the CI run that commit starts is the
  # one that can pass.
  #
  # It is the one job here that writes to the repository, so it is the one job
  # that runs nothing from the pull request: it applies patches, which are data
  # to git, and pushes. The job that made them ran the pull request's code
  # with no credential but the build server's key.
  #
  # The push is made as a GitHub App rather than with GITHUB_TOKEN,
  # because a push made with GITHUB_TOKEN starts no workflow, and a fixed head
  # nobody runs CI on is a pull request that can never pass. A fork's branch is
  # not this repository's to push to, and a fork's run has no secrets to push
  # with, so there the failure and its patches are the whole of the answer.
  #
  # This is not part of the gate. Whether the pull request passes was decided
  # by ci; this only decides whether its author has to push the fix themselves.
  #
  # A fix that pins a new release of crates/bootstrap waits for
  # publish-bootstrap, since the run its push starts downloads that release,
  # and is not pushed if the upload failed.
  autofix:
    name: push autofixes
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.ci.result == 'failure' &&
      needs.publish-bootstrap.result != 'failure'
    needs: [ci, publish-bootstrap]
    runs-on: ubuntu-24.04
    steps:
      # A run that failed without changing anything uploaded nothing, so
      # finding no patch here is the ordinary way for this job to have nothing
      # to do.
      - uses: actions/download-artifact@v8
        with:
          pattern: autofix
          path: ${{ runner.temp }}/autofix
          merge-multiple: true

      - name: Look for patches
        id: patches
        run: |
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/autofix/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'Nothing to push: verification changed nothing in the checkout.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.patches.outputs.found == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The same head the ci job checked out, so that the patch applies to the
      # tree it was made from. The token is kept out of .git/config and handed
      # to the one command that needs it.
      - uses: actions/checkout@v7
        if: steps.patches.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # A patch that will not apply stops the push rather than being pushed
      # half-applied.
      #
      # A head that is already this job's own commit and still needed fixing
      # is a fix that does not settle, and pushing again would only start the
      # same run again, so that is where it stops and a person looks. The
      # commit is recognised by its author and its message together, so that
      # anything else the app pushes is not mistaken for it.
      #
      # The push is to the branch by name and never forced. If the author
      # pushed while this ran, their commit wins, and the run their push
      # started has fixes of its own to make.
      - name: Push the fixes to the pull request
        if: steps.patches.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$APP_SLUG[bot]"
          message='style: apply the fixes from ./scripts/verify'
          if [ "$(git log -1 --format=%an)" = "$author" ] && [ "$(git log -1 --format=%s)" = "$message" ]; then
            echo "::error::The head is already an autofix commit and verification still changed it. Run ./scripts/verify and commit what it changes."
            exit 1
          fi

          git config user.name "$author"
          git config user.email "$author@users.noreply.github.com"
          for patch in "$RUNNER_TEMP"/autofix/*.patch; do
            git apply --index "$patch"
          done
          git commit --quiet --message "$message"
          git show --stat HEAD

          git push "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

  # Every script runs crates/bootstrap's release that scripts/internal/pins
  # names (guides/bootstrap.md). When a pull request changes the crate, ci
  # builds it for every platform and pins it, and this uploads each binary to
  # the be3-ci Bunny storage zone as bootstrap/<sha256>, which the pin's
  # downloads come from through the zone's CDN. A name that is its content's
  # hash never changes what it points at, so nothing an older commit pins is
  # ever replaced; nothing deletes them. What the artifact holds was built by
  # the pull request's code, so here it is only data: each file's hash is
  # checked against its name before it is uploaded. The storage key is given
  # to the upload step alone.
  publish-bootstrap:
    name: publish the bootstrap
    needs: [ci]
    if: >-
      !cancelled() &&
      needs.ci.outputs.bootstrap == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap
          path: ${{ runner.temp }}/bootstrap

      - name: Upload it
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
        run: |
          set -euo pipefail
          for binary in "$RUNNER_TEMP"/bootstrap/*; do
            name="$(basename "$binary")"
            if [ "$(sha256sum "$binary" | cut -c1-64)" != "$name" ]; then
              echo "::error::$name is not the SHA-256 of its contents."
              exit 1
            fi
            curl --fail --silent --show-error --retry 3 --output /dev/null \
              --request PUT \
              --header "AccessKey: $BUNNY_STORAGE_KEY" \
              --header 'Content-Type: application/octet-stream' \
              --upload-file "$binary" \
              "https://storage.bunnycdn.com/be3-ci/bootstrap/$name"
          done

  # The images go to the be3-ci Bunny storage zone as paint-previews/<hash>.png,
  # named by the SHA-256 of their bytes, and the comment links them through the
  # zone's CDN. A name that is its content's hash never changes what it points
  # at, so an upload never has to replace anything a comment already links,
  # and an image two runs both drew is stored once. The same goes for the
  # review page's data, paint-previews/<hash>.json, and for the review page
  # itself (crates/paint-review-web), paint-previews/site/<hash>/, named by
  # the hash of all of its files; a site already there is not uploaded again.
  # The page uses shared wasm memory, so the zone must send
  # Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy:
  # require-corp on /paint-previews/site/*, an edge rule in the pull zone's
  # settings rather than anything an upload can set. The storage key is given
  # to the upload step alone. What the artifact holds was made by the pull
  # request's code, so it is only ever data here: files to upload and text to
  # post. A run of an older pull request uploads only what it made, images.
  #
  # Every pull request gets the one comment, which each run edits: the lines it
  # adds and removes by kind, and the paintings it changes, if any, with a link
  # to the review page.
  # The comment is found again by the marker this job puts at its top, rather
  # than one the pull request's code writes.
  publish-summary:
    name: comment the pull request summary
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.outputs.previews == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews

      - name: Upload the previews
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          store='https://storage.bunnycdn.com/be3-ci/paint-previews'
          previews="$RUNNER_TEMP/previews"

          upload() {
            case "$1" in
              *.png) type='image/png' ;;
              *.json) type='application/json' ;;
              *.html) type='text/html' ;;
              *.js) type='text/javascript' ;;
              *.wasm) type='application/wasm' ;;
              *.ttf) type='font/ttf' ;;
              *) type='application/octet-stream' ;;
            esac
            curl --fail --silent --show-error --retry 3 --output /dev/null \
              --request PUT \
              --header "AccessKey: $BUNNY_STORAGE_KEY" \
              --header "Content-Type: $type" \
              --upload-file "$previews/$1" \
              "$store/$1"
          }

          for file in "$previews"/*.png "$previews"/*.json; do
            upload "$(basename "$file")"
          done

          for site in "$previews"/site/*/; do
            site="site/$(basename "$site")"
            if curl --fail --silent --output /dev/null \
              --header "AccessKey: $BUNNY_STORAGE_KEY" "$store/$site/index.html"; then
              continue
            fi
            (cd "$previews" && find "$site" -type f ! -name index.html) | while read -r file; do
              upload "$file"
            done
            upload "$site/index.html"
          done

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          previews="$RUNNER_TEMP/previews"
          comment="$RUNNER_TEMP/comment.md"
          marker='<!-- pr-summary -->'
          {
            echo "$marker"
            sed 's|PREVIEW_ROOT|https://be3-ci.b-cdn.net/paint-previews|g' "$previews/comment.md"
          } > "$comment"

          existing="$(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments" |
            jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker))) | .id' |
            sed -n 1p)"

          if [ -n "$existing" ]; then
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" --input - > /dev/null
          else
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method POST "repos/$REPOSITORY/issues/$NUMBER/comments" --input - > /dev/null
          fi
