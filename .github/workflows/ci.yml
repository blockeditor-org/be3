name: CI

on:
  # Running on main is what gives every other run a cache to restore from. A
  # GitHub Actions cache written on a branch can only be read back from that
  # branch and from the runs of pull requests based on it, so until something
  # ran here, every entry these jobs wrote was one only the branch that wrote
  # it could ever use.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is work on a commit nobody is waiting for any
  # more. A run on main is not: it is the one that fills the caches, and a merge
  # queue run is what a merge is waiting on, so neither is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A default build leaves out the debug terminal, which needs a Zig toolchain
  # and a Ghostty checkout before cargo can link anything, the embedded browser,
  # which is a dependency tree nothing else in the workspace shares, and cvl2,
  # which nothing depends on. That keeps a local checkout and the check someone
  # runs a hundred times a day cheap. What ships and what is linted is still the
  # whole of it, so every job here asks for a full build.
  BE3_FULL: 1
  # scripts/internal/common.sh routes rustc through sccache against a shared
  # object store, reading with a key that is public and writing only when it is
  # handed one that is not. Every job takes the write key from here, so any run
  # that has the secret fills the cache for the ones that don't: a pull request
  # from a fork sees an empty value and reads the same cache read-only.
  #
  # That store answers a compilation wherever it runs, which is what a fork's
  # first run and every cold runner live on. The Actions caches beside it are
  # the cheaper half of the same idea: see .github/actions/cargo-cache.
  BUNNY_SCCACHE_PASSWORD: ${{ secrets.BUNNY_SCCACHE_PASSWORD }}
  # BuildBuddy, which runs every buck2 action. A pull request from a fork sees
  # an empty value, and ./scripts/buck says so rather than building.
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

# ./scripts/verify is one command locally and three jobs here. Its three parts
# need nothing from one another, and run together they were the longest thing in
# this workflow by a wide margin, so everything else finished and waited. Split,
# the wall clock is the longest part rather than the sum of all of them.
jobs:
  # What keeps the rest of this file honest. Everything a job installs before it
  # builds anything is trusted completely, so the rules about how those are
  # named - a commit for a third-party action, a tag only for GitHub's own, no
  # expansion of an input into a shell script - are worth more as a check than
  # as a convention. .github/zizmor.yml is where the policy is written.
  #
  # It is first because it costs seconds and needs nothing: a pull request that
  # got the pinning wrong hears about it while the builds are still starting.
  workflows:
    name: workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: zizmor@1.30.1

      # The token is what lets zizmor check that each pinned commit is really in
      # the repository it is attributed to, which is the half of pinning that
      # reading the workflow cannot tell you. Without it that audit is skipped
      # and the rest still run.
      - name: Lint the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml .github/workflows .github/actions

  lint:
    name: clippy and fmt
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      #
      # A pull request is checked out at its head rather than at the merge
      # GitHub makes of it, because what this job fixes is pushed back to that
      # head and has to apply there. The merge queue only merges a head that
      # already contains main, so nothing is tested here that main has not seen.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # block-app links GTK and WebKitGTK for the file picker and the embedded
      # browser, and ALSA for audio playback, so the workspace does not
      # compile without their headers. Clippy links nothing, but the build
      # scripts that ask pkg-config for those libraries still run.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Each game's build script builds the same crate again as a wasm module
      # the host loads, so even a native check of one needs the wasm target.
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Declared before every other cache in the job; the action says why.
      - uses: ./.github/actions/cargo-cache

      - uses: ./.github/actions/sccache

      # The app links libghostty-vt, the terminal emulator behind the debug
      # terminal window, which scripts/internal/build-ghostty-vt.sh compiles from
      # source with Zig.
      - uses: ./.github/actions/ghostty-vt
        with:
          triple: x86_64-unknown-linux-gnu

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # ./scripts/verify formats the BUCK files as well as the Rust, and skips
      # that silently when the formatter is not installed. Only the formatter is
      # needed for it, not buck2 itself.
      - name: Install starlark_fmt
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          ./scripts/internal/install-starlark-fmt.sh

      - uses: ./.github/actions/verify
        with:
          part: lint

      - uses: ./.github/actions/sccache-report
        if: always()

  # The tests run through buck2 on BuildBuddy: every test binary is built on a
  # worker and most tests run there too, so nothing here compiles and this
  # runner needs no toolchain. What it does need is a graphics device for the
  # tests that stay on it - beui's renderer - and libvulkan1 and the mesa
  # drivers are the software one.
  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan1 mesa-vulkan-drivers

      - uses: ./.github/actions/buck2

      - uses: ./.github/actions/verify
        with:
          part: tests

  # The plugin tests, which buck2 builds on a worker and runs here: they read
  # the accepted paintings out of snapshots/ and, on a pull request, write the
  # ones that changed back for the autofix job to push. A plugin test that
  # paints through the gpu abi opens the software Vulkan device.
  plugin-tests:
    name: plugin tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan1 mesa-vulkan-drivers

      - uses: ./.github/actions/buck2

      - uses: ./.github/actions/verify
        with:
          part: plugin-tests

  buck:
    name: buck2
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # For ./scripts/buckify below, which reads the workspace through cargo
      # metadata, and for the reindeer it runs.
      - uses: ./.github/actions/rust-toolchain

      - uses: ./.github/actions/buck2
        with:
          reindeer: 'true'

      # third-party/rust/BUCK is generated from the workspace's Cargo.toml and
      # checked in, so this is what says the two still agree. A pull request
      # that changed a dependency and did not run ./scripts/buckify fails here
      # rather than in whichever job first tried to build the crate.
      - name: Check the generated third-party rules are current
        run: |
          ./scripts/buckify
          git diff --exit-code third-party/rust/BUCK

      # Everything, on BuildBuddy's workers: the tests jobs above build what
      # they test, and this is what says the rest - the binaries, the plugin
      # and game modules - builds too.
      - run: ./scripts/buck build //crates/...

  web:
    name: web bundle
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The WASI sysroot is built against by clang, not by rustc, so the build
      # needs a local LLVM of at least version 19: FreeType's setjmp/longjmp
      # calls are lowered by `-wasm-enable-sjlj`, and older LLVMs lower those
      # to env.saveSetjmp/testSetjmp/getTempRet0 JS imports that no browser
      # (and no import map here) provides. LLVM 19+ lowers them to
      # __wasm_setjmp/__wasm_setjmp_test/__wasm_longjmp instead, which resolve
      # entirely inside the wasm module against libsetjmp.a.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20 llvm-20
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads

      - uses: ./.github/actions/sccache

      # The build script installs this itself when it is missing; a prebuilt one
      # is much faster. The version has to match the wasm-bindgen crate.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: wasm-bindgen-cli@0.2.122

      - uses: ./.github/actions/wasi-sysroot

      # The app links libghostty-vt, the terminal emulator behind the debug
      # terminal window, which scripts/internal/build-ghostty-vt.sh compiles from
      # source with Zig.
      - uses: ./.github/actions/ghostty-vt
        with:
          triple: wasm32-wasip1-threads

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # The plugin modules are the same bytes on every platform, so the plugin
      # job builds them once for all of them and this bundle goes without. What
      # is served is the app; the modules reach it from somewhere else.
      - run: ./scripts/build --target web --release --no-plugins

      - uses: ./.github/actions/sccache-report
        if: always()

      - uses: actions/upload-artifact@v7
        with:
          name: block-web
          path: target/web
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: target/web

  plugins:
    name: plugin and game modules
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A plugin's C dependencies are compiled by clang rather than by rustc,
      # so this needs a local LLVM of at least version 19 for the same reason
      # the web job does: only from 19 onwards do FreeType's setjmp/longjmp
      # calls lower to imports that resolve inside the module.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20 llvm-20
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1-threads

      - uses: ./.github/actions/sccache

      - uses: ./.github/actions/wasi-sysroot

      - run: ./scripts/build --target plugins --release --output dist

      - uses: ./.github/actions/sccache-report
        if: always()

      # Every platform loads these same bytes, so they are uploaded once rather
      # than repeated inside each platform's archive. A manifest resolves its
      # entry point against its own directory, so the two ship together.
      - uses: actions/upload-artifact@v7
        with:
          name: block-plugins
          path: dist
          retention-days: 14

  android:
    name: android apk
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # android/gradle/wrapper/gradle-wrapper.jar is the one binary committed to
      # this repository, and it runs before any build script does. This checks
      # it byte for byte against the wrapper jars Gradle publishes, so a commit
      # that quietly swapped it fails here rather than executing.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The runner image ships an Android SDK, but not the NDK release the app
      # is built against. Every package is pinned to an exact version, and
      # sdkmanager checks each one against the checksum in Google's repository
      # manifest, so what is asked for here is the whole of what arrives.
      #
      # The NDK is the only one of these the stable channel does not list, so it
      # is the only one fetched with --channel=3. Asking for the canary channel
      # for all of them meant a typo in any version string could resolve to a
      # canary build of something that has a perfectly good stable release.
      - name: Install the Android SDK packages
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          "$sdkmanager" --channel=3 --install "ndk;29.0.14206865"

      # Nothing here is compiled to wasm any more, so this job wants neither
      # wasm target, neither the WASI sysroot nor the LLVM that builds against
      # it, and not the plugin compiler either, which is wasmtime with a
      # Cranelift backend for every architecture rather than just this one.
      # That was most of what this job spent its time on.
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android

      - uses: ./.github/actions/sccache

      # The app links libghostty-vt, the terminal emulator behind the debug
      # terminal window, which scripts/internal/build-ghostty-vt.sh compiles from
      # source with Zig.
      - uses: ./.github/actions/ghostty-vt
        with:
          triple: aarch64-linux-android

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # No gradle-version: the wrapper the build runs through names it, and this
      # step is here for the dependency cache it keeps between runs. Naming a
      # version here as well would install a second Gradle that nothing uses,
      # and would be a copy of the version to keep in step with the wrapper.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A freshly generated keystore would sign every CI build with a different
      # key, and Android refuses to install an update signed with a different
      # key than the one already on the device. Restore a persisted keystore
      # from a repo secret instead, so successive CI builds stay installable
      # as updates over one another. Fork PRs don't get repo secrets, so fall
      # back to a throwaway keystore there (and locally) just to keep the
      # build working; those builds won't share a key with the real ones.
      - name: Restore the debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p target
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > target/android-debug.keystore
          else
            keytool -genkeypair -v \
              -keystore target/android-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # A CI build sharing the app's real package name would either silently
      # overwrite a locally-built install (if it happened to share a signing
      # key) or block installation with a signature-mismatch error (since it
      # doesn't, now that the key is pinned in "Restore the debug keystore").
      # Give it its own application ID and label instead, so it installs
      # side by side with a local build rather than colliding with it.
      #
      # The plugin modules are the same bytes on every platform, so the plugin
      # job builds them once for all of them and this APK goes without. Android
      # will fetch them rather than carry them; until it does, the app there
      # finds no editors, which is where it already stood.
      - run: >-
          ./scripts/build --target android
          --android-sdk "$ANDROID_SDK_ROOT"
          --application-id com.be3.block.ci
          --label "Block (CI)"
          --no-plugins

      - uses: ./.github/actions/sccache-report
        if: always()

      - uses: actions/upload-artifact@v7
        with:
          name: block-app-android-aarch64
          path: target/debug/apk/block-app.apk
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            client: true
          # The client needs GTK and WebKitGTK for the target architecture,
          # which Ubuntu only supplies through a multiarch sysroot, so only the
          # server is cross-compiled here.
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            client: false
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            client: true
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            client: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            client: true
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            client: true
    steps:
      # persist-credentials: false, because none of these jobs push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.client && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # rusqlite compiles SQLite from source, so the cross build needs a C
      # compiler and a linker for the target as well as the Rust std. The cross
      # gcc only recommends the target libc headers, which --no-install-recommends
      # drops, and without them it falls back to the host's /usr/include.
      - name: Install the aarch64 Linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/sccache

      # The app links libghostty-vt, the terminal emulator behind the debug
      # terminal window, which scripts/internal/build-ghostty-vt.sh compiles from
      # source with Zig.
      - uses: ./.github/actions/ghostty-vt
        if: matrix.client
        with:
          triple: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.client
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      # fetch-pdfium.sh skips its download when this is already populated.
      # The release it downloads from is pinned and hash-checked, so the
      # cached copy can't go stale silently; it only saves a redundant fetch
      # from a redirect that intermittently 504s.
      - name: Cache PDFium
        if: matrix.client
        uses: actions/cache@v6
        with:
          path: target/tools/pdfium-*
          key: pdfium-${{ matrix.target }}-1

      # The plugins job builds the wasm modules for every platform at once, so
      # this builds only what belongs to this one: the executables, and the
      # PDFium the PDF plugin loads at runtime.
      - name: Build
        shell: bash
        run: >-
          ./scripts/build --target ${{ matrix.target }} --release --output dist
          --no-plugins
          ${{ matrix.client && ' ' || '--no-client' }}
          ${{ runner.os == 'macOS' && '--sign-identity -' || ' ' }}

      - uses: ./.github/actions/sccache-report
        if: always()

      - uses: actions/upload-artifact@v7
        with:
          name: block-${{ matrix.name }}
          path: dist
          retention-days: 14

  # A pull request's verification fixes what it can and accepts what the tests
  # paint, and each part that changed anything uploads the change as a patch
  # and fails. This puts those patches together and pushes them to the pull
  # request's branch as one commit, and the CI run that commit starts is the
  # one that can pass.
  #
  # It is the one job here that writes to the repository, so it is the one job
  # that runs nothing from the pull request: it applies patches, which are data
  # to git, and pushes. The jobs that made them ran the pull request's code
  # with no credentials at all.
  #
  # The push is made as the merge queue's app rather than with GITHUB_TOKEN,
  # because a push made with GITHUB_TOKEN starts no workflow, and a fixed head
  # nobody runs CI on is a pull request that can never pass. A fork's branch is
  # not this repository's to push to, and a fork's run has no secrets to push
  # with, so there the failure and its patches are the whole of the answer.
  #
  # Not in the gate below. Whether the pull request passes was decided by the
  # parts that failed; this only decides whether its author has to push the
  # fix themselves.
  autofix:
    name: push autofixes
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(needs.*.result, 'failure')
    needs: [lint, test, plugin-tests]
    runs-on: ubuntu-24.04
    steps:
      # A part that failed without changing anything uploaded nothing, so
      # finding no patch here is the ordinary way for this job to have nothing
      # to do.
      - uses: actions/download-artifact@v8
        with:
          pattern: autofix-*
          path: ${{ runner.temp }}/autofix
          merge-multiple: true

      - name: Look for patches
        id: patches
        run: |
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/autofix/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'Nothing to push: no part of verification changed the checkout.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.patches.outputs.found == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The same head the parts checked out, so that every patch applies to the
      # tree it was made from. The token is kept out of .git/config and handed
      # to the one command that needs it.
      - uses: actions/checkout@v7
        if: steps.patches.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The parts ran apart from one another, so two of them could in principle
      # have changed the same lines. They do not in practice, since the lint
      # pass writes sources and the test runs write paintings, and a patch that
      # will not apply stops the push rather than being pushed half-applied.
      #
      # A head that is already this job's own commit and still needed fixing
      # is a fix that does not settle, and pushing again would only start the
      # same run again, so that is where it stops and a person looks.
      #
      # The push is to the branch by name and never forced. If the author
      # pushed while this ran, their commit wins, and the run their push
      # started has fixes of its own to make.
      - name: Push the fixes to the pull request
        if: steps.patches.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$APP_SLUG[bot]"
          if [ "$(git log -1 --format=%an)" = "$author" ]; then
            echo "::error::The head is already an autofix commit and verification still changed it. Run ./scripts/verify and commit what it changes."
            exit 1
          fi

          git config user.name "$author"
          git config user.email "$author@users.noreply.github.com"
          for patch in "$RUNNER_TEMP"/autofix/*.patch; do
            git apply --index "$patch"
          done
          git commit --quiet --message 'style: apply the fixes from ./scripts/verify'
          git show --stat HEAD

          git push "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

  # The merge queue's decision logic is JavaScript rather than Rust, so
  # ./scripts/verify's three parts do not compile it and buck2 does not
  # run it. It is a few seconds of Node either way, and what it guards is the
  # thing that decides whether a pull request merges, so it gets a job of its
  # own and a place in the gate below.
  merge-queue-tests:
    name: merge queue tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No install step, because there is nothing to install: the queue runs on
      # the standard library and node:test, so that the code holding the merge
      # button has no dependency anyone has to keep pinned.
      - name: Test the merge queue
        run: node --test --test-reporter=spec '.github/merge-queue/*.test.js'

  # The one check the ruleset on main requires, and the only thing the merge
  # queue in merge-queue.yml waits for. Everything above is a job this needs,
  # so requiring this one name requires all of them, and adding a job to the
  # list above extends the gate without anyone editing the ruleset.
  #
  # always(), and nothing else. A job whose `if` is false does not run, and
  # GitHub reports what did not run as a skipped check run, which a required
  # status check accepts the same way it accepts a pass. A condition here that
  # can be false is therefore a gate that opens itself: this job spent a while
  # carrying `github.event_name != 'pull_request'` and resolved to skipped on
  # every pull request, which satisfied the rule without reading a single one
  # of its needs. always() is what makes it run after the needs finish
  # whatever they did, so that the step below is the thing that decides.
  ci-ok:
    name: 'CI OK'
    if: always()
    needs: [workflows, lint, test, plugin-tests, buck, web, plugins, android, native, merge-queue-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
