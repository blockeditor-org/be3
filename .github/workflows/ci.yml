name: CI

on:
  # Running on main is what gives every other run a cache to restore from. A
  # GitHub Actions cache written on a branch can only be read back from that
  # branch and from the runs of pull requests based on it, so until something
  # ran here, every entry these jobs wrote was one only the branch that wrote
  # it could ever use.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is work on a commit nobody is waiting for any
  # more. A run on main is not: it is the one that fills the caches, and a merge
  # queue run is what a merge is waiting on, so neither is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # BuildBuddy, which runs every buck2 action. A pull request from a fork sees
  # an empty value, and ./scripts/buck says so rather than building.
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

# Two jobs do the work. build is one buck2 build of everything CI builds, on
# every platform, and uploads what ships. verify is ./scripts/buck run //:verify,
# a runner for each of its three parts, which fixes what it can on a pull
# request. autofix pushes those fixes, paint-previews shows a pull request's
# changed paintings in a comment, and CI OK is the gate. Everything runs on BuildBuddy's workers, so what a runner
# needs is buck2 and whatever runs here rather than there.
jobs:
  # buck/ci/BUCK names what is built: //crates/... for the host, which is what
  # ./scripts/buck builds for on every machine; each platform's release app
  # and server; the plugins, the web bundle and the APK; and each platform's
  # dev app, which is what `run` builds on a machine of that platform, so that
  # running it on a commit CI has seen is a cache hit. The first command builds
  # all of it and downloads nothing. The second downloads only what is
  # uploaded, which the first has built; --out takes one target, and one that
  # downloads nothing cannot be written out.
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false, because this job does not push, and a
      # checkout that keeps the token leaves it readable in .git/config to
      # every build script, test and dependency the job goes on to run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/buck2

      # The commit the release apps report; the dev builds say unknown whatever
      # this is, so they stay the ones a person's machine asks for.
      - name: Build everything
        env:
          COMMIT: ${{ github.sha }}
        run: >-
          ./scripts/buck build --materializations=none -c "be3.commit=$COMMIT"
          //buck/ci:everything //crates/...

      - name: Download what is uploaded
        env:
          COMMIT: ${{ github.sha }}
        run: ./scripts/buck build -c "be3.commit=$COMMIT" //buck/ci:artifacts --out dist

      # Each platform's app, server and PDFium. The plugins are uploaded once
      # beside them, since every platform loads the same bytes and a manifest
      # resolves its entry point against its own directory.
      - uses: actions/upload-artifact@v7
        with:
          name: block-linux-x86_64
          path: dist/block-linux-x86_64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-linux-aarch64
          path: dist/block-linux-aarch64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-windows-x86_64
          path: dist/block-windows-x86_64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-windows-aarch64
          path: dist/block-windows-aarch64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-macos-aarch64
          path: dist/block-macos-aarch64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-macos-x86_64
          path: dist/block-macos-x86_64
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-plugins
          path: dist/block-plugins
          retention-days: 14

      # Signed on a worker with CI's debug keystore, which BuildBuddy keeps as
      # the secret ANDROID_DEBUG_KEYSTORE_BASE64, so successive CI builds
      # install as updates over one another. Like every platform's app it goes
      # without the plugins.
      - uses: actions/upload-artifact@v7
        with:
          name: block-app-android-aarch64
          path: dist/block-app-android-aarch64/block-app.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: block-web
          path: dist/block-web
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/block-web

  # ./scripts/buck run //:verify, the way a person runs it: the lint pass and
  # the tests on BuildBuddy's workers, and the plugin tests here, since they
  # read and write the accepted paintings in snapshots/. Each part has a runner
  # of its own, since they need nothing from one another and one after another
  # they were the longest thing in this workflow by a wide margin. On a pull request it
  # fixes and accepts instead of only reporting, and anything that leaves the
  # checkout changed is uploaded as a patch for the autofix job to push, and
  # fails this job. Everywhere else nothing may be written: main, the merge
  # queue and a manual run are asking whether what is there is right, and a
  # fix on any of them has nowhere to go.
  #
  # Accepting a painting that changed, or one that is new, is on purpose:
  # the commit that carries it is what a reviewer looks at in Paint review.
  verify:
    name: verify ${{ matrix.part }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [lint, tests, plugin-tests]
    steps:
      # A pull request is checked out at its head rather than at the merge
      # GitHub makes of it, because what this job fixes is pushed back to that
      # head and has to apply there. The merge queue only merges a head that
      # already contains main, so nothing is tested here that main has not seen.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The workflows and the sysroot lockfile are linted with the rest of the
      # lint pass. zizmor goes first, before anything from the pull request
      # has run.
      # Everything a job installs before it builds anything is trusted
      # completely, so the rules about how those are named - a commit for a
      # third-party action, a tag only for GitHub's own, no expansion of an
      # input into a shell script - are worth more as a check than as a
      # convention. .github/zizmor.yml is where the policy is written.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        if: matrix.part == 'lint'
        with:
          tool: zizmor@1.30.1

      # The token is what lets zizmor check that each pinned commit is really in
      # the repository it is attributed to, which is the half of pinning that
      # reading the workflow cannot tell you. It is given to this step alone.
      - name: Lint the workflows
        if: matrix.part == 'lint'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --config .github/zizmor.yml .github/workflows .github/actions

      # A plugin test that paints through the gpu abi opens the software
      # Vulkan device.
      - name: Install system dependencies
        if: matrix.part == 'plugin-tests'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan1 mesa-vulkan-drivers

      # The merge queue's tests, which the tests part runs when node is here.
      # The queue runs on the standard library and node:test, so there is
      # nothing to install beyond node.
      - uses: actions/setup-node@v7
        if: matrix.part == 'tests'
        with:
          node-version: '22'

      - uses: ./.github/actions/buck2
        if: ${{ !cancelled() }}

      # buck/sysroot/packages.bzl is the lockfile of what buck/sysroot/BUCK
      # asks for, and is checked in. Re-resolving it here is what says the two
      # still agree; on a pull request a stale one is a fix like any other.
      - name: Re-resolve the sysroot lockfile
        if: ${{ !cancelled() && matrix.part == 'lint' }}
        env:
          CHECK: ${{ github.event_name != 'pull_request' }}
        run: |
          ./scripts/buck run //:lock-sysroot
          if [ "$CHECK" = true ]; then
            git diff --exit-code buck/sysroot/packages.bzl
          fi

      - name: Run //:verify --${{ matrix.part }}
        if: ${{ !cancelled() }}
        env:
          CHECK: ${{ github.event_name != 'pull_request' }}
          PART: ${{ matrix.part }}
        run: |
          if [ "$CHECK" = true ]; then
            ./scripts/buck run //:verify -- --check "--$PART"
          else
            ./scripts/buck run //:verify -- "--$PART"
          fi

      # Everything a fix can do shows up in git: an edited file, a moved one,
      # and an untracked one such as a painting that was accepted for the first
      # time, which is why this stages the whole tree before it asks. What is
      # ignored stays out, which is everything a build leaves behind.
      #
      # This runs whether or not verification passed. A run that failed on one
      # test has still accepted the paintings the others made, and a run that
      # failed on a clippy warning it could not fix has still formatted the
      # rest, and both of those are worth the push.
      - name: Collect what verification changed
        id: collect
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PART: ${{ matrix.part }}
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo 'Verification changed nothing.'
            echo 'dirty=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          mkdir -p "$RUNNER_TEMP/autofix"
          git diff --cached --binary > "$RUNNER_TEMP/autofix/$PART.patch"
          echo 'dirty=true' >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: autofix-${{ matrix.part }}
          path: ${{ runner.temp }}/autofix/${{ matrix.part }}.patch
          retention-days: 1

      # A pull request whose fixes changed something is not the pull request
      # that passed: the one that passes is the commit the autofix job pushes,
      # and CI runs again on that.
      - name: Fail because verification changed the checkout
        if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
        run: |
          echo '::error::Verification changed the checkout. The autofix job pushes the change to this branch when it can; otherwise run ./scripts/buck run //:verify and commit what it changes.'
          exit 1

  # A pull request's verification fixes what it can and accepts what the tests
  # paint, and each part that changed anything uploads the change as a patch
  # and fails. This puts those patches together and pushes them to the pull
  # request's branch as one commit, and the CI run that commit starts is the
  # one that can pass.
  #
  # It is the one job here that writes to the repository, so it is the one job
  # that runs nothing from the pull request: it applies patches, which are data
  # to git, and pushes. The jobs that made them ran the pull request's code
  # with no credentials at all.
  #
  # The push is made as the merge queue's app rather than with GITHUB_TOKEN,
  # because a push made with GITHUB_TOKEN starts no workflow, and a fixed head
  # nobody runs CI on is a pull request that can never pass. A fork's branch is
  # not this repository's to push to, and a fork's run has no secrets to push
  # with, so there the failure and its patches are the whole of the answer.
  #
  # Not in the gate below. Whether the pull request passes was decided by
  # verify; this only decides whether its author has to push the fix
  # themselves.
  autofix:
    name: push autofixes
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(needs.*.result, 'failure')
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      # A part that failed without changing anything uploaded nothing, so
      # finding no patch here is the ordinary way for this job to have nothing
      # to do.
      - uses: actions/download-artifact@v8
        with:
          pattern: autofix-*
          path: ${{ runner.temp }}/autofix
          merge-multiple: true

      - name: Look for patches
        id: patches
        run: |
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/autofix/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo 'Nothing to push: no part of verification changed the checkout.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        if: steps.patches.outputs.found == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_QUEUE_APP_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The same head the parts checked out, so that every patch applies to the
      # tree it was made from. The token is kept out of .git/config and handed
      # to the one command that needs it.
      - uses: actions/checkout@v7
        if: steps.patches.outputs.found == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The parts ran apart from one another, so two of them could in principle
      # have changed the same lines. They do not in practice, since the lint
      # pass writes sources and the test runs write paintings, and a patch that
      # will not apply stops the push rather than being pushed half-applied.
      #
      # A head that is already this job's own commit and still needed fixing
      # is a fix that does not settle, and pushing again would only start the
      # same run again, so that is where it stops and a person looks.
      #
      # The push is to the branch by name and never forced. If the author
      # pushed while this ran, their commit wins, and the run their push
      # started has fixes of its own to make.
      - name: Push the fixes to the pull request
        if: steps.patches.outputs.found == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          author="$APP_SLUG[bot]"
          if [ "$(git log -1 --format=%an)" = "$author" ]; then
            echo "::error::The head is already an autofix commit and verification still changed it. Run ./scripts/buck run //:verify and commit what it changes."
            exit 1
          fi

          git config user.name "$author"
          git config user.email "$author@users.noreply.github.com"
          for patch in "$RUNNER_TEMP"/autofix/*.patch; do
            git apply --index "$patch"
          done
          git commit --quiet --message 'style: apply the fixes from ./scripts/buck run //:verify'
          git show --stat HEAD

          git push "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$BRANCH"

  # Every painting a pull request changes, drawn before, after, and with what
  # changed marked, in one comment on the pull request that each run edits
  # rather than adding to. It runs on the commit GitHub makes by merging the
  # head into the base, so the rasterizer is the base's even when the head
  # branched off before it existed, and a painting the autofix job accepts
  # shows up in the run its commit starts.
  #
  # It is two jobs for the same reason verify and autofix are. This one builds
  # and runs the rasterizer from the pull request, so it has no credentials;
  # publish-paint-previews runs nothing from the pull request and does the
  # writing. A fork's run has no BuildBuddy key to build with and no token to
  # write with, so it has no previews.
  #
  # Not in the gate below: a preview is for the reviewer, and verify is what
  # decides whether the paintings are right.
  paint-previews:
    name: render paint previews
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # The merge commit and its first parent, the base it was merged into:
      # what differs between the two is what the pull request changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/buck2

      - name: Collect the paintings the pull request changed
        run: |
          base="$(git rev-parse HEAD^1)"
          before="$RUNNER_TEMP/paintings/before"
          after="$RUNNER_TEMP/paintings/after"
          mkdir -p "$before" "$after"
          git diff --name-only --no-renames -z "$base" HEAD -- 'snapshots/*.paint' |
            while IFS= read -r -d '' path; do
              name="$(basename "$path")"
              if git cat-file -e "$base:$path" 2> /dev/null; then
                git show "$base:$path" > "$before/$name"
              fi
              if [ -e "$path" ]; then
                cp "$path" "$after/$name"
              fi
            done

      - name: Render them
        run: >-
          ./scripts/buck run //crates/paint-snapshot:preview-example --
          "$RUNNER_TEMP/paintings/before" "$RUNNER_TEMP/paintings/after" "$RUNNER_TEMP/previews"

      - uses: actions/upload-artifact@v7
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews
          retention-days: 1

  # The images go on a branch of their own, paint-previews/<number>, as one
  # commit that each run replaces, and the comment links them by that commit.
  # It is pushed with GITHUB_TOKEN, which starts no workflow, and nothing else
  # reads the branch. What the artifact holds was made by the pull request's
  # code, so it is only ever data here: files to commit and text to post.
  #
  # A pull request that no longer changes any painting has its comment edited
  # to say so and its branch deleted; one that never did gets no comment.
  publish-paint-previews:
    name: comment paint previews
    needs: [paint-previews]
    if: needs.paint-previews.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paint-previews
          path: ${{ runner.temp }}/previews

      - name: Publish the previews and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          previews="$RUNNER_TEMP/previews"
          branch="paint-previews/$NUMBER"
          comment="$RUNNER_TEMP/comment.md"

          existing="$(gh api --paginate "repos/$REPOSITORY/issues/$NUMBER/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- paint-previews -->"))) | .id' |
            sed -n 1p)"

          if compgen -G "$previews/*/*.png" > /dev/null; then
            cd "$previews"
            git -c init.defaultBranch=previews init --quiet
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- ./*/
            git commit --quiet --message "Paint previews for #$NUMBER"
            git push --quiet --force "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "HEAD:refs/heads/$branch"
            sha="$(git rev-parse HEAD)"
            sed "s|PREVIEW_ROOT|https://github.com/$REPOSITORY/raw/$sha|g" comment.md > "$comment"
          else
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch" > /dev/null 2>&1 || true
            if [ -z "$existing" ]; then
              echo 'The pull request changes no paintings.'
              exit 0
            fi
            cp "$previews/comment.md" "$comment"
          fi

          if [ -n "$existing" ]; then
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" --input - > /dev/null
          else
            jq --raw-input --slurp '{body: .}' "$comment" |
              gh api --method POST "repos/$REPOSITORY/issues/$NUMBER/comments" --input - > /dev/null
          fi

  # The one check the ruleset on main requires, and the only thing the merge
  # queue in merge-queue.yml waits for. Everything above is a job this needs,
  # so requiring this one name requires all of them, and adding a job to the
  # list above extends the gate without anyone editing the ruleset.
  #
  # always(), and nothing else. A job whose `if` is false does not run, and
  # GitHub reports what did not run as a skipped check run, which a required
  # status check accepts the same way it accepts a pass. A condition here that
  # can be false is therefore a gate that opens itself: this job spent a while
  # carrying `github.event_name != 'pull_request'` and resolved to skipped on
  # every pull request, which satisfied the rule without reading a single one
  # of its needs. always() is what makes it run after the needs finish
  # whatever they did, so that the step below is the thing that decides.
  ci-ok:
    name: 'CI OK'
    if: always()
    needs: [build, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to have passed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
