name: Tracker

# Moves the rows of the tracker database that a pull request names, such as
# BE-7K3Q2M in its branch, title or body: opening it sets them to In review and
# links it on each row's page, and merging it sets them to Done. It is the be
# command line tool's `be pull-request` (crates/be-cli), signed in as the agent
# whose token and recovery phrase are the repository's BE3_TRACKER_TOKEN and
# BE3_TRACKER_RECOVERY_PHRASE secrets; without them the job does nothing.
#
# be is built from the default branch rather than from the pull request: this
# workflow holds the agent's credentials, so it runs no code a pull request
# brings, and a pull request opened before be existed is still moved.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  move:
    name: move tracker rows
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check for the tracker's credentials
        id: credentials
        env:
          BE3_TOKEN: ${{ secrets.BE3_TRACKER_TOKEN }}
          BE3_RECOVERY_PHRASE: ${{ secrets.BE3_TRACKER_RECOVERY_PHRASE }}
        run: |
          if [ -n "$BE3_TOKEN" ] && [ -n "$BE3_RECOVERY_PHRASE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "The tracker's credentials are not set, so no rows are moved."
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.credentials.outputs.present == 'true' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/buck2
        if: ${{ steps.credentials.outputs.present == 'true' }}

      - name: Build be
        if: ${{ steps.credentials.outputs.present == 'true' }}
        env:
          BE3_NAMESPACE_TOKEN: ${{ secrets.BE3_NAMESPACE_TOKEN }}
        run: ./scripts/buck build //crates/be-cli:be --out "$RUNNER_TEMP/be"

      - name: Move the rows the pull request names
        if: ${{ steps.credentials.outputs.present == 'true' }}
        env:
          BE3_SERVER: ${{ vars.BE3_SERVER }}
          BE3_WORKSPACE: ${{ vars.BE3_WORKSPACE }}
          BE3_STATUS_FIELD: ${{ vars.BE3_STATUS_FIELD }}
          BE3_REVIEW_STATUS: ${{ vars.BE3_REVIEW_STATUS }}
          BE3_DONE_STATUS: ${{ vars.BE3_DONE_STATUS }}
          BE3_TOKEN: ${{ secrets.BE3_TRACKER_TOKEN }}
          BE3_RECOVERY_PHRASE: ${{ secrets.BE3_TRACKER_RECOVERY_PHRASE }}
        run: '"$RUNNER_TEMP/be" pull-request "$GITHUB_EVENT_PATH"'
