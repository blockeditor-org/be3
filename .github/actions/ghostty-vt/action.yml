name: Cache the libghostty-vt archive
description: >-
  Restores the libghostty-vt archive a previous run built for this target, so a
  job that only needs to link the terminal emulator does not have to fetch a
  Ghostty checkout and compile it with Zig to get there.

# internal/build-ghostty-vt.sh writes the archive and a stamp naming everything
# that decided what went into it, and returns immediately when the two are
# already there and the stamp still matches. So all a restore has to do is put
# those two files back; a mismatched stamp rebuilds, which is what makes a cache
# entry this action's key failed to invalidate a slow run rather than a wrong
# one.
#
# Only the archive is cached, not the Ghostty checkout under external/: the
# checkout is a hundred and fifty megabytes that a hit makes unnecessary, and a
# miss has to fetch anyway.
inputs:
  triple:
    description: The target triple the archive is built for
    required: true

runs:
  using: composite
  steps:
    # The commit and the patch come out of the build script rather than being
    # repeated here, for the same reason the toolchain action reads the channel
    # out of rust-toolchain.toml: two copies of a version are one copy and a bug.
    - id: pin
      shell: bash
      # The triple arrives through the environment rather than being expanded
      # into the script text. Every caller passes a target this repository
      # chose, so there is nothing to exploit today, but an expansion lands as
      # shell source before bash sees it, and the one that is safe only because
      # of who happens to call it is the one that stops being safe quietly.
      env:
        TRIPLE: ${{ inputs.triple }}
      run: |
        commit="$(sed -n "s/^ghostty_commit='\(.*\)'$/\1/p" scripts/internal/build-ghostty-vt.sh)"
        if [ -z "$commit" ]; then
          echo 'scripts/internal/build-ghostty-vt.sh pins no Ghostty commit' >&2
          exit 1
        fi
        patch="$(git hash-object scripts/internal/ghostty-vt.patch)"
        echo "key=ghostty-vt-$TRIPLE-$commit-$patch" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: target/ghostty-vt/${{ inputs.triple }}
        key: ${{ steps.pin.outputs.key }}
