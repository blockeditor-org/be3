name: Verify
description: >-
  Runs one part of ./scripts/verify. On a pull request it runs the way a person
  does, fixing and accepting instead of only reporting, and anything that leaves
  changed or new in the checkout is uploaded as a patch for the autofix job in
  ci.yml to push back to the branch, and fails this job.

inputs:
  part:
    description: The part of ./scripts/verify to run, one of lint, tests or plugin-tests.
    required: true

runs:
  using: composite
  steps:
    # Everywhere but a pull request nothing may be written: main, the merge
    # queue and a manual run are asking whether what is there is right, and a
    # fix on any of them has nowhere to go.
    #
    # A pull request is the one place a fix has a home. Its run applies every
    # fix and accepts every painting the way a person's run does, so that its
    # author is told what changed by a commit on their branch rather than by a
    # log they have to go and read. That includes a painting that changed and
    # one that is new: accepting those in CI is on purpose here, because the
    # commit that carries them is what a reviewer looks at in Paint review.
    - name: Run ./scripts/verify --${{ inputs.part }}
      shell: bash
      env:
        MODE: ${{ github.event_name == 'pull_request' && '--ci' || '--check' }}
        PART: ${{ inputs.part }}
      run: ./scripts/verify "$MODE" "--$PART"

    # Everything a fix can do shows up in git: an edited file, a moved one, and
    # an untracked one such as a painting that was accepted for the first time,
    # which is why this stages the whole tree before it asks. What is ignored
    # stays out, which is everything a build leaves behind.
    #
    # This runs whether or not verification passed. A run that failed on one
    # test has still accepted the paintings the others made, and a run that
    # failed on a clippy warning it could not fix has still formatted the rest,
    # and both of those are worth the push.
    - name: Collect what verification changed
      id: collect
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: |
        git add --all
        if git diff --cached --quiet; then
          echo 'Verification changed nothing.'
          echo 'dirty=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git diff --cached --stat
        mkdir -p "$RUNNER_TEMP/autofix"
        git diff --cached --binary > "$RUNNER_TEMP/autofix/$PART.patch"
        echo 'dirty=true' >> "$GITHUB_OUTPUT"

    - if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: autofix-${{ inputs.part }}
        path: ${{ runner.temp }}/autofix/${{ inputs.part }}.patch
        retention-days: 1

    # A pull request whose fixes changed something is not the pull request
    # that passed: the one that passes is the commit the autofix job pushes,
    # and CI runs again on that.
    - name: Fail because verification changed the checkout
      if: ${{ !cancelled() && steps.collect.outputs.dirty == 'true' }}
      shell: bash
      run: |
        echo '::error::Verification changed the checkout. The autofix job pushes the change to this branch when it can; otherwise run ./scripts/verify and commit what it changes.'
        exit 1
