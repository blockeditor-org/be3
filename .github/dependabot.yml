version: 2

# Every third-party action is pinned to a commit SHA rather than a tag, because
# a tag is a mutable pointer and the thing it points at installs our compiler.
# The cost of that is a pin nobody would otherwise notice going stale, which is
# what this file is for: Dependabot moves the SHA and rewrites the "# vX.Y.Z"
# comment beside it, so an upgrade arrives as a reviewable pull request instead
# of arriving silently the way a tag would.
#
# Without this, pinning is strictly worse than floating: the same exposure to a
# compromised upstream, minus the security fixes.
updates:
  - package-ecosystem: github-actions
    # Plain "/" is only the workflows. The one composite action under
    # .github/actions, buck2, uses nothing, so it is not named.
    directories:
      - /
    schedule:
      interval: weekly
    # One pull request for all of them. These land together or not at all, and
    # five separate bumps a week is the amount of noise that gets a bot muted.
    groups:
      actions:
        patterns:
          - '*'

  # One workspace, one Cargo.lock at the root. Minor and patch bumps come as a
  # single grouped pull request so a workspace this size stays one review a
  # week; a major bump gets its own, since that is where the breaking changes
  # are. The generated buck files are rebuilt from Cargo.toml by ./scripts/buck,
  # so most bumps need nothing else committed beside them.
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types:
          - minor
          - patch
    # The exception is wasm-bindgen: buck/cargo/BUCK installs wasm-bindgen-cli
    # at exactly the version Cargo.lock has, and the two refuse to work across
    # releases. js-sys and web-sys each require an exact wasm-bindgen, so a bump
    # to any of them drags it along. That family moves by hand, together with
    # the pin.
    ignore:
      - dependency-name: wasm-bindgen*
      - dependency-name: js-sys
      - dependency-name: web-sys
