# Configuration for zizmor, the workflow security linter the "workflows" job in
# ci.yml runs. What is set here is the project's pinning policy, written down
# somewhere a machine checks rather than only in a review comment.
rules:
  # A third-party action must be pinned to a commit, because a tag is a mutable
  # pointer: whoever owns it, or whoever takes their account, can repoint it at
  # anything, and what these actions install is the toolchain everything else in
  # the job trusts. Actions under actions/ are GitHub's own, published from the
  # same place the runner and the workflow syntax come from, so a tag there is
  # not a wider trust than the one already being extended, and their tags carry
  # the security fixes a frozen SHA would miss.
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        '*': hash-pin

  # zizmor prefers GitHub's newer "$/..." spelling over "./..." for an action
  # that lives in this repository. Both resolve to the same checked-out file and
  # neither widens what is trusted, so this is a style preference rather than a
  # finding, and taking it would mean changing every call site in the workflow
  # to a spelling that is younger than the runners some of them target.
  self-repository:
    ignore:
      - ci.yml

  # pull_request_target and workflow_run are what merge-queue.yml is built on,
  # and both earn this finding for the same good reason: they run in the base
  # repository, with its secrets, on an event a pull request author controls.
  # The usual way that goes wrong is a workflow that then checks out the pull
  # request and runs something from it - a build, a test, an install script -
  # at which point the author has written code that runs next to the secrets.
  #
  # That workflow never reads a pull request as code. It checks out the default
  # branch by name, installs nothing, builds nothing, and runs one script from
  # the branch it checked out. What it takes from the event is a number, a
  # login and a comment body, and all three are treated as data. There is no
  # other way to build a queue on these events, because the whole point of them
  # is to notice what a pull request did.
  dangerous-triggers:
    ignore:
      - merge-queue.yml
