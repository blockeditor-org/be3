# Prometheus (nl-prometheus.service), which keeps a year of the build server's metrics for Grafana: the machine's
# (node_exporter, with nl-stats.py's count of running actions) and NativeLink's (otel-collector.yaml).
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: node
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  - job_name: nativelink
    static_configs: [{ targets: ["127.0.0.1:8889"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
