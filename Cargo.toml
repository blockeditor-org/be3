resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = false

# Line tables are worth having for the code in this repository, because a
# backtrace through it is a backtrace someone is about to act on. For the six
# hundred crates underneath it they are debug info nobody reads, emitted by
# rustc and then carried through every link. "*" is dependencies only, so the
# workspace keeps what the profile above gives it.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release-check]
inherits = "dev"
debug-assertions = false
overflow-checks = false
debug = false
incremental = false

[profile.plugin]
inherits = "dev"
opt-level = 2
debug = false
strip = "debuginfo"
incremental = false

[profile.plugin-release]
inherits = "release"
strip = "debuginfo"

# The new block stack seals every chunk it stores with ChaCha20-Poly1305 and
# names it by its SHA-256, and unoptimised those are most of what saving or
# opening a file costs: eight megabytes took three and a half seconds to save
# and two and a half to open in a debug build. Optimising the cipher, the hash
# and be-store, which instantiates both, brings that to a third of a second.
# The websocket they travel over masks every byte a client sends, which is the
# same kind of loop.

[profile.dev.package.aead]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.be-store]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.block-buffer]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.chacha20]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.chacha20poly1305]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.cipher]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.digest]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.poly1305]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.sha2]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.tungstenite]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.tokio-tungstenite]
