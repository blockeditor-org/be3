[package]
name = "be-sdk"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block = { path = "../be-block" }
be-sdk-api = { path = "../be-sdk-api" }
be-sdk-manifest = { path = "../be-sdk-manifest" }
be-sdk-type-guest = { path = "../be-sdk-type-guest" }
be-sdk-ui = { path = "../be-sdk-ui" }
beui-lucide = { path = "../beui-lucide" }
be-lib-geometry = { path = "../be-lib-geometry" }
beui-paint-format = { path = "../beui-paint-format" }
serde_bytes = "0.11"
serde_json = "1"
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
uuid = { version = "1", features = ["v7"] }

# An app is a wasm guest wherever it runs, so it links wgpu with only the
# custom backend and reaches the host's device through the gpu abi, whether
# wasmtime or the browser is holding it. Everything under here is the guest,
# which is why a native build of this crate is only the host types an editor's
# own tests drive it through. The device reaches an app's ui framework through
# the Instance trait; this crate draws nothing itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }
be-wasm-gpu-guest = { path = "../be-wasm-gpu-guest" }
wgpu = { version = "29", default-features = false, features = ["custom", "std", "web", "wgsl"] }

[dev-dependencies]
be-type-checklist = { path = "../be-type-checklist" }

[lints]
workspace = true
