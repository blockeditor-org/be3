[package]
name = "beui-font-browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-core = { path = "../beui-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "FontFaceSet",
    "HtmlCanvasElement",
    "HtmlHeadElement",
    "TextMetrics",
    "Window",
] }

[lints]
workspace = true
