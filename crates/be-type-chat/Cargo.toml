[package]
name = "be-type-chat"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
be-block-content = { path = "../be-block-content" }
be-block-commit = { path = "../be-block-commit", default-features = false }
be-block-model = { path = "../be-block-model" }
be-sdk-type-guest = { path = "../be-sdk-type-guest" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
uuid = "1"

[dev-dependencies]
be-block-store = { path = "../be-block-store" }
pollster = "0.4"

[features]
module = []

[lints]
workspace = true
