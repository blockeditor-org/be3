[package]
name = "local-tools"
description = "What runs on this machine after a buck2 command: verify, deploy and the fuzz runner"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
beui-html = { path = "../beui-html" }
build-id = { path = "../build-id" }
paint-snapshot = { path = "../paint-snapshot" }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
ureq = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
wasmtime = { version = "48", default-features = false, features = ["cache", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p1"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
