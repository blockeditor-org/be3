[package]
name = "local-tools"
description = "What runs on this machine after a buck2 command: verify, deploy and the fuzz runner"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
beui-html = { path = "../beui-html" }
build-id = { path = "../build-id" }
paint-snapshot = { path = "../paint-snapshot" }
jks = { version = "0.3", default-features = false }
p12-keystore = "0.4"
rsa = { version = "0.9", features = ["getrandom", "sha2"] }
x509-cert = { version = "0.2", features = ["builder"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = { version = "0.10", features = ["oid"] }
ureq = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
