[package]
name = "be-wasm-gpu-shim"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
be-wasm-gpu-host = { path = "../be-wasm-gpu-host" }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
be-wasm-dylink = { path = "../be-wasm-dylink" }
web-sys = { version = "0.3", features = [
    "ImageBitmap",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Performance",
    "WorkerGlobalScope",
    "console",
] }
wgpu = { version = "29", default-features = false, features = ["std", "webgl", "webgpu", "wgsl"] }

[lints]
workspace = true
