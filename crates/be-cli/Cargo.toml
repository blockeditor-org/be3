[package]
name = "be-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "be"
path = "src/main.rs"

[dependencies]
be-block = { path = "../be-block" }
be-client = { path = "../be-client" }
be-commit = { path = "../be-commit" }
be-graph = { path = "../be-graph" }
be-keys = { path = "../be-keys" }
be-protocol = { path = "../be-protocol" }
be-store = { path = "../be-store" }
be-sync = { path = "../be-sync" }
build-id = { path = "../build-id" }
futures-util = "0.3"
block-ui = { path = "../block-ui" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
be-server = { path = "../be-server" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
