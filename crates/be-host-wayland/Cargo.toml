[package]
name = "be-host-wayland"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-lib-dmabuf = { path = "../be-lib-dmabuf" }
beui = { path = "../beui" }
beui-fonts = { path = "../beui-fonts" }
beui-host = { path = "../beui-host" }
gvdb = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.48", default-features = false, features = ["system-fonts", "text"] }
rustix = { version = "1", features = ["event", "fs", "pipe", "process"] }
smithay = { version = "0.7", default-features = false, features = ["backend_drm", "desktop", "wayland_frontend", "xwayland"] }
wgpu = { version = "29", default-features = false, features = ["vulkan"] }

[dev-dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-paint-snapshot = { path = "../beui-paint-snapshot" }
rustix = { version = "1", features = ["event", "fs", "pipe", "process"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[lints]
workspace = true
