[package]
name = "beui-renderer-dom"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-core = { path = "../beui-core" }
beui-font-browser = { path = "../beui-font-browser" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "Node",
    "Window",
] }

[lints]
workspace = true
