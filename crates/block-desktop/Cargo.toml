[package]
name = "block-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[lib]
name = "block_desktop"
path = "src/lib.rs"

[[bin]]
name = "block-desktop"
path = "src/main.rs"

# block-app as a Linux desktop: the Wayland compositor its programs' windows are
# drawn in, the session on the displays and input devices themselves, the lock
# screen, power, sound, notifications and the tray.
[target.'cfg(target_os = "linux")'.dependencies]
async-executor = "1"
async-io = "2"
async-lock = "3"
be-block = { path = "../be-block" }
be-dmabuf = { path = "../be-dmabuf" }
be-wayland = { path = "../be-wayland" }
beui = { path = "../beui", default-features = false, features = ["render", "window"] }
beui-adapter-drm = { path = "../beui-adapter-drm" }
block-app = { path = "../block-app" }
block-plugin-api = { path = "../block-plugin-api" }
futures-util = { version = "0.3", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
libc = "0.2"
# The PulseAudio protocol, which pipewire-pulse serves, in pure Rust: the volume
# keys set the default sink's and source's volume and mute through it.
pulseaudio = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
pollster = "0.4"
uuid = { version = "1", features = ["v4"] }
wgpu = { version = "29", default-features = false }

[lints]
workspace = true
