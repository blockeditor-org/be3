[package]
name = "be-block-commit"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["store"]
# The host's parts, which a pure guest does without: reading and writing sealed commits
# (`CommitStore`) and the server's history retention (`retention`).
store = ["be-block-store/vault"]

[dependencies]
be-block-store = { path = "../be-block-store", default-features = false }
serde = { version = "1", features = ["derive"] }
similar = "3.1"
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true
