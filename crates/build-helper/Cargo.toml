[package]
name = "build-helper"
description = "Builds named products of a commit on request with ./scripts/buck, uploads them to the CDN by content hash, and wakes Namespace's remote execution cluster"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
