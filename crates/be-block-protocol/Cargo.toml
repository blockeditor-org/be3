[package]
name = "be-block-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block-commit = { path = "../be-block-commit", default-features = false }
be-block-graph = { path = "../be-block-graph" }
be-wasm-ops = { path = "../be-wasm-ops" }
be-wasm-ops-bindgen = { path = "../be-wasm-ops-bindgen" }
be-block-store = { path = "../be-block-store", default-features = false }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true
