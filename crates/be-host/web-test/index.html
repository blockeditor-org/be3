<!doctype html>
<meta charset="utf-8">
<title>push notifications</title>
<script type="module">
    // plans/notifications.md, the web: a push reaches sw.js, which asks this page (push.js)
    // to open it and shows what it answers. The host's calls are stubs here. Nothing waits for
    // a time to pass: each step resumes from the message that ends it.
    import { bindPush } from "./push.js";

    const ORGANIZATION = "41414141-4141-4141-4141-414141414141";
    const BLOCK = "42424242-4242-4242-4242-424242424242";

    const calls = [];
    const opened = [];
    let changes = 0;
    let answer;
    bindPush({
        open: (bytes) => {
            calls.push(bytes);
            return typeof answer === "function" ? answer() : Promise.resolve(answer);
        },
        openBlock: (named) => opened.push(named),
        changed: () => changes++,
    });

    // What the worker showed and told this page, in order, with what waits for the next.
    const shown = [];
    const waiting = [];
    navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data?.shown) {
            shown.push(event.data.shown);
        }
        for (const check of waiting.splice(0)) {
            check();
        }
    });

    // Resolves once `done()` holds, as the worker's messages arrive (the harness times the
    // whole test out).
    function until(done) {
        return new Promise((resolve) => {
            const check = () => (done() ? resolve() : waiting.push(check));
            check();
        });
    }

    // A PushMessage: 16 bytes each of organization, block and sender, then the sealed text.
    // DevTools carries it as text, so the ids are text too: ASCII, or letters of two UTF-8
    // bytes each.
    function message(ids, sealed) {
        return ids.join("") + sealed;
    }
    const ascii = ["A", "B", "C"].map((fill) => fill.repeat(16));
    const letters = ["é", "è", "ê"].map((fill) => fill.repeat(8));

    function expect(condition, what) {
        if (!condition) {
            throw new Error(what);
        }
    }

    async function worker() {
        return (await navigator.serviceWorker.ready).active;
    }

    globalThis.outcome = (async () => {
        try {
            await navigator.serviceWorker.register("./sw.js");
            const active = await worker();

            // With a window to open it, the notification shows what the window answers.
            answer = { title: "Roadmap", body: "Alice: lunch?", block: BLOCK, organization: ORGANIZATION };
            await deliverPush(message(ascii, "first"));
            await until(() => shown.length === 1);
            expect(shown[0].title === "Roadmap", `title was ${shown[0].title}`);
            expect(shown[0].body === "Alice: lunch?", `body was ${shown[0].body}`);
            expect(shown[0].tag === BLOCK, `tag was ${shown[0].tag}`);
            expect(shown[0].renotify === true, "a push sounds");
            expect(shown[0].data.block === BLOCK && shown[0].data.organization === ORGANIZATION, "it names its block");
            expect(calls.length === 1, "the window opened the push once");

            // The same push again is not opened again; what was shown stays, replaced
            // under its tag without a sound, so the push still shows something.
            await deliverPush(message(ascii, "first"));
            await until(() => shown.length === 2);
            expect(calls.length === 1, "the window was asked about a repeat");
            expect(shown[1].title === "Roadmap" && shown[1].tag === BLOCK, "a repeat shows what was shown");
            expect(shown[1].renotify === false, "a repeat makes no sound");

            // A window that cannot open one (no key): a notification naming nothing.
            answer = null;
            await deliverPush(message(ascii, "second"));
            await until(() => shown.length === 3);
            expect(shown[2].title === "New message" && shown[2].body === "", "the generic one names nothing");
            expect(calls.length === 2, "the window was asked about the second push");

            // Bytes that are no push at all still show one.
            await deliverPush("x");
            await until(() => shown.length === 4);
            expect(shown[3].title === "New message", `title was ${shown[3].title}`);

            // A push is forgotten once a device would refuse it as too old, so a push the
            // server sends again then is opened afresh.
            answer = { title: "Roadmap again", body: "", block: BLOCK, organization: ORGANIZATION };
            active.postMessage({ advance: 2 * 24 * 60 * 60 * 1000 + 1 });
            await deliverPush(message(ascii, "first"));
            await until(() => shown.length === 5);
            expect(calls.length === 3, "an old push was not opened again");
            expect(shown[4].title === "Roadmap again", `title was ${shown[4].title}`);

            // Ids that are not ASCII arrive whole.
            answer = { title: "Letters", body: "", block: BLOCK, organization: ORGANIZATION };
            await deliverPush(message(letters, "ünï"));
            await until(() => shown.length === 6);
            const bytes = calls[3];
            expect(bytes.length === 48 + 5, `the push was ${bytes.length} bytes`);
            expect(
                Array.from(bytes.subarray(0, 4), (byte) => byte.toString(16)).join("") === "c3a9c3a9",
                "the organization's bytes were kept",
            );

            // No window answering in time: a notification naming nothing, after a while.
            answer = () => new Promise(() => {});
            await deliverPush(message(ascii, "third"));
            await until(() => shown.length === 7);
            expect(shown[6].title === "New message", `title was ${shown[6].title}`);

            // A press opens the block in the window.
            active.postMessage({ click: { organization: ORGANIZATION, block: BLOCK } });
            await until(() => opened.length === 1);
            expect(opened[0].block === BLOCK && opened[0].organization === ORGANIZATION, "the press named its block");

            // The push service replacing the subscription is told to the window.
            active.postMessage({ changed: true });
            await until(() => changes === 1);

            return { passed: true, message: "pushes show the window's answer, once, or name nothing" };
        } catch (error) {
            return { error: String(error?.stack ?? error) };
        }
    })();
</script>
