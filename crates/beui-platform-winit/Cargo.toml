[package]
name = "beui-platform-winit"
edition.workspace = true
version.workspace = true
license.workspace = true

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
accesskit = "0.24.1"
beui-core = { path = "../beui-core" }
beui-types = { path = "../beui-types" }
beui-runner = { path = "../beui-runner" }
pollster = "0.4"
winit = "=0.31.0-beta.3"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "macos", target_os = "ios"))))'.dependencies]
accesskit_unix = "0.22.1"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.34.0"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.26.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# The native file dialog. Linux asks xdg-desktop-portal and then zenity itself,
# so it can say when neither is there.
[target.'cfg(all(not(target_os = "android"), not(target_os = "linux"), not(target_arch = "wasm32")))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util = "0.3"

[lints]
workspace = true
