[package]
name = "be-launcher"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
be-block = { path = "../be-block" }
beui = { path = "../beui" }
beui-host = { path = "../beui-host" }
comrak = { version = "0.55", default-features = false }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
terminal-emulator = { path = "../terminal-emulator" }
terminal-types = { path = "../editors/terminal/types" }
terminal-view = { path = "../terminal-view" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
ureq = "2"

[dev-dependencies]
block-ui-test = { path = "../block-ui-test" }

[lints]
workspace = true
