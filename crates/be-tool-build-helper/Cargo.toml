[package]
name = "be-tool-build-helper"
description = "Builds named products of a commit on request with ./scripts/buck, uploads them to the CDN by content hash"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "build-helper"
path = "src/main.rs"

[dependencies]
be-lib-sha256 = { path = "../be-lib-sha256" }
be-tool-storage = { path = "../be-tool-storage" }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
