[package]
name = "be-host-stack"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
testing = []

[dependencies]
be-block = { path = "../be-block" }
be-block-client = { path = "../be-block-client" }
be-block-commit = { path = "../be-block-commit" }
be-block-graph = { path = "../be-block-graph" }
be-block-keys = { path = "../be-block-keys" }
be-block-protocol = { path = "../be-block-protocol" }
be-block-store = { path = "../be-block-store" }
be-block-type-host = { path = "../be-block-type-host" }
be-block-vcs = { path = "../be-block-vcs" }
be-host-base = { path = "../be-host-base" }
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }
be-sdk-api = { path = "../be-sdk-api" }
be-sdk-manifest = { path = "../be-sdk-manifest" }
be-sdk-type-api = { path = "../be-sdk-type-api" }
be-sdk-type-guest = { path = "../be-sdk-type-guest" }
be-lib-build-id = { path = "../be-lib-build-id" }
be-lib-search = { path = "../be-lib-search" }
futures-util = { version = "0.3", features = ["io"] }
be-sdk-type-host = { path = "../be-sdk-type-host" }
serde_json = "1"
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
be-wasm-threads = { path = "../be-wasm-threads" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
be-server = { path = "../be-server" }
be-wasm-host = { path = "../be-wasm-host" }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
be-sdk = { path = "../be-sdk" }
be-type-chat = { path = "../be-type-chat" }
be-type-checklist = { path = "../be-type-checklist" }
be-type-example-counter = { path = "../be-type-example-counter" }
be-block-fault-relay = { path = "../be-block-fault-relay" }
be-type-bundle = { path = "../be-type-bundle" }
be-lib-web-push = { path = "../be-lib-web-push" }
be-type-image = { path = "../be-type-image" }
be-type-presentation = { path = "../be-type-presentation" }
be-type-terminal = { path = "../be-type-terminal" }
be-type-text = { path = "../be-type-text" }
ureq = { version = "2", features = ["gzip"] }
be-type-workspace = { path = "../be-type-workspace" }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dev-dependencies]
be-tool-cli = { path = "../be-tool-cli" }

[lints]
workspace = true
