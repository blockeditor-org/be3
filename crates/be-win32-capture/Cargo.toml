[package]
name = "be-win32-capture"
description = "Windows monitors and windows captured with Windows.Graphics.Capture, handed out as wgpu textures on wgpu's Vulkan device"
edition.workspace = true
version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
ash = "0.38"
wgpu = { version = "29", default-features = false, features = ["vulkan"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[lints]
workspace = true
