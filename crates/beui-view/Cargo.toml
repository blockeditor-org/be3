[package]
name = "beui-view"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
accesskit = "0.24.1"
beui-html = { path = "../beui-html" }
beui-tree = { path = "../beui-tree" }
beui-types = { path = "../beui-types" }
beui-macros = { path = "../beui-macros" }
beui-reactive = { path = "../beui-reactive" }
be-lib-stable-hash = { path = "../be-lib-stable-hash" }

[target.'cfg(beui_html)'.dependencies]
beui-core-html = { path = "../beui-core-html" }

[target.'cfg(not(beui_html))'.dependencies]
beui-core = { path = "../beui-core" }
be-lib-graphemes = { path = "../be-lib-graphemes" }

[dev-dependencies]
beui-paint-snapshot = { path = "../beui-paint-snapshot" }

[lints]
workspace = true
