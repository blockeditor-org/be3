[package]
name = "beui-host"
description = "beui with its engine: the renderer, fonts, inspector, drive and the headless and web platforms"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
web = [
    "beui-renderer-wgpu/web",
    "dep:beui-platform-web",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

[dependencies]
beui = { path = "../beui" }
beui-core = { path = "../beui-core" }
beui-runner = { path = "../beui-runner" }
beui-font-freetype = { path = "../beui-font-freetype" }
beui-inspector = { path = "../beui-inspector" }
beui-keyboard = { path = "../beui-keyboard" }
beui-layer-drive = { path = "../beui-layer-drive" }
beui-platform-headless = { path = "../beui-platform-headless" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
beui-view = { path = "../beui-view" }
be-lib-stable-hash = { path = "../be-lib-stable-hash" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-platform-web = { path = "../beui-platform-web", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "console",
] }

[dev-dependencies]
accesskit = "0.24.1"
be-tool-bench = { path = "../be-tool-bench" }
raw-window-handle = "0.6"
beui-reactive = { path = "../beui-reactive" }
beui-text-editor-core = { path = "../beui-text-editor-core" }
wgpu = { version = "29", default-features = false }

[lints]
workspace = true

[[example]]
name = "text-bench"
