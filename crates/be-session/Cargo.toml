[package]
name = "be-session"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["store"]
# Resuming over the commit store, which a pure guest asks its host to do.
store = ["be-commit/store"]

[dependencies]
be-commit = { path = "../be-commit", default-features = false }
be-protocol = { path = "../be-protocol" }
be-store = { path = "../be-store", default-features = false }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true
