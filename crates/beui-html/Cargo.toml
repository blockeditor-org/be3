[package]
name = "beui-html"
description = "HTML with beui-tree components and ordinary CSS, as strings or as live browser DOM"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-tree = { path = "../beui-tree" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CharacterData",
    "Comment",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Node",
    "Text",
    "Window",
    "console",
] }

[lints]
workspace = true
