[package]
name = "block-editor-beui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block = { path = "../be-block" }
beui = { path = "../beui", default-features = false }
beui-platform-plugin-api = { path = "../beui-platform-plugin-api" }
block-editor-plugin = { path = "../block-editor-plugin" }
block-plugin-api = { path = "../block-plugin-api" }
block-ui = { path = "../block-ui" }
database-types = { path = "../editors/database/types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
text-editor-core = { path = "../text-editor-core" }
uuid = { version = "1", features = ["v4"] }
workspace-ui-types = { path = "../editors/workspace-ui/types" }

[dev-dependencies]
be-model = { path = "../be-model" }
beui-platform-plugin = { path = "../beui-platform-plugin" }
presentation-types = { path = "../editors/presentation/types" }

[lints]
workspace = true
