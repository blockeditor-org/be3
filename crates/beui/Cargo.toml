[package]
name = "beui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["window"]
render = ["dep:beui-renderer-wgpu", "beui-components-styled/gpu"]
window = [
    "render",
    "dep:beui-platform-android",
    "dep:beui-platform-headless",
    "dep:beui-layer-space",
    "dep:beui-platform-winit",
    "dep:pollster",
    "dep:serde_json",
]
web = [
    "render",
    "beui-renderer-wgpu/web",
    "dep:beui-platform-web",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
dom = [
    "dep:beui-platform-web",
    "dep:beui-font-browser",
    "dep:beui-renderer-dom",
    "beui-renderer-dom/web",
    "dep:web-sys",
]

[dependencies]
accesskit = "0.24.1"
beui-components-styled = { path = "../beui-components-styled" }
beui-components-unstyled = { path = "../beui-components-unstyled" }
beui-core = { path = "../beui-core" }
beui-font-freetype = { path = "../beui-font-freetype" }
beui-inspector = { path = "../beui-inspector" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu", optional = true }
beui-view = { path = "../beui-view" }
beui_macros = { path = "../beui-macros" }
reactive = { path = "../reactive" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beui-layer-space = { path = "../beui-layer-space", optional = true }
pollster = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
beui-platform-android = { path = "../beui-platform-android", optional = true }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
beui-platform-headless = { path = "../beui-platform-headless", optional = true }
beui-platform-winit = { path = "../beui-platform-winit", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-platform-web = { path = "../beui-platform-web", optional = true }
beui-font-browser = { path = "../beui-font-browser", optional = true }
beui-renderer-dom = { path = "../beui-renderer-dom", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "console",
] }

[dev-dependencies]
bench = { path = "../bench" }
raw-window-handle = "0.6"
text-editor-core = { path = "../text-editor-core" }
wgpu = { version = "29", default-features = false }

[lints]
workspace = true

[[example]]
name = "survey"
required-features = ["window"]

[[example]]
name = "text-bench"
