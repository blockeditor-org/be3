[package]
name = "beui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["window"]
render = ["dep:beui-renderer-wgpu"]
window = ["render", "dep:beui-adapter-android", "dep:beui-adapter-winit"]
web = ["render", "beui-renderer-wgpu/web", "dep:beui-adapter-web"]

[dependencies]
accesskit = "0.24.1"
beui-components-styled = { path = "../beui-components-styled" }
beui-components-unstyled = { path = "../beui-components-unstyled" }
beui-core = { path = "../beui-core" }
beui-font-freetype = { path = "../beui-font-freetype" }
beui-inspector = { path = "../beui-inspector" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu", optional = true }
beui-view = { path = "../beui-view" }
beui_macros = { path = "../beui_macros" }
reactive = { path = "../reactive" }

[target.'cfg(target_os = "android")'.dependencies]
beui-adapter-android = { path = "../beui-adapter-android", optional = true }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
beui-adapter-winit = { path = "../beui-adapter-winit", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-adapter-web = { path = "../beui-adapter-web", optional = true }

[dev-dependencies]
text-editor-core = { path = "../text-editor-core" }
wgpu = { version = "29", default-features = false }

[lints]
workspace = true

[[example]]
name = "demo"
required-features = ["window"]

[[example]]
name = "counter"
required-features = ["window"]

[[example]]
name = "dock"
required-features = ["window"]

[[example]]
name = "survey"
required-features = ["window"]
