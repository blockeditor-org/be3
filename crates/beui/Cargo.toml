[package]
name = "beui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
accesskit = "0.24.1"
beui-components-unstyled = { path = "../beui-components-unstyled" }
beui-dock = { path = "../beui-dock" }
beui-keyboard = { path = "../beui-keyboard" }
beui-view = { path = "../beui-view" }
beui_macros = { path = "../beui-macros" }
reactive = { path = "../reactive" }

[target.'cfg(beui_html)'.dependencies]
beui-components-styled = { path = "../beui-components-styled" }

[target.'cfg(not(beui_html))'.dependencies]
beui-components-styled = { path = "../beui-components-styled", features = ["gpu"] }
beui-core = { path = "../beui-core" }
beui-draw = { path = "../beui-draw" }

[target.'cfg(beui_html)'.dev-dependencies]
paint-snapshot = { path = "../paint-snapshot" }

[lints]
workspace = true
