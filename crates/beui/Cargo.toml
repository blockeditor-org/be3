[package]
name = "beui"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["window"]
render = ["dep:bytemuck", "dep:wgpu", "wgpu/std", "wgpu/wgsl"]
window = [
    "render",
    "dep:accesskit_android",
    "dep:accesskit_winit",
    "dep:arboard",
    "dep:jni",
    "dep:ndk",
    "dep:ndk-context",
    "dep:ndk-sys",
    "dep:pollster",
    "dep:winit",
    "wgpu/default",
]
web = [
    "render",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "wgpu/webgpu",
    "wgpu/webgl",
]

[dependencies]
beui_macros = { path = "../beui_macros" }
accesskit = "0.24.1"
bytemuck = { version = "1", features = ["derive"], optional = true }
freetype = "0.7"
harfbuzz_rs = "2"
pollster = { version = "0.4", optional = true }
geometry = { path = "../geometry" }
reactive = { path = "../reactive" }
text-editor-core = { path = "../text-editor-core" }
unicode-script = "0.5"
wgpu = { version = "29", default-features = false, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
accesskit_winit = { version = "0.33.2", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
accesskit_android = { version = "0.7.5", features = ["embedded-dex"], optional = true }
jni = { version = "0.22", optional = true }
ndk = { version = "0.9", default-features = false, optional = true }
ndk-context = { version = "0.1", optional = true }
ndk-sys = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AddEventListenerOptions",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Touch",
    "TouchEvent",
    "TouchList",
    "WheelEvent",
    "Window",
    "console",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard = { version = "3.6", default-features = false, optional = true }

[lints]
workspace = true

[[example]]
name = "demo"
required-features = ["window"]

[[example]]
name = "counter"
required-features = ["window"]

[[example]]
name = "dock"
required-features = ["window"]

[[example]]
name = "survey"
required-features = ["window"]
