[package]
name = "beui-host-window"
description = "A beui program's entry: in a window of its own on winit or Android, with the space and XR layers, or in a browser on either core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui = { path = "../beui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beui-core = { path = "../beui-core" }
beui-host = { path = "../beui-host" }
beui-layer-drive = { path = "../beui-layer-drive" }
beui-layer-space = { path = "../beui-layer-space" }
beui-layer-xr = { path = "../beui-layer-xr" }
beui-platform-headless = { path = "../beui-platform-headless" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
beui-runner = { path = "../beui-runner" }
pollster = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
beui-platform-android = { path = "../beui-platform-android" }

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
beui-platform-winit = { path = "../beui-platform-winit" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
be-wasm-threads = { path = "../be-wasm-threads" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Url", "UrlSearchParams", "Window"] }

[target.'cfg(all(target_arch = "wasm32", not(beui_html)))'.dependencies]
beui-host = { path = "../beui-host", features = ["web"] }

[lints]
workspace = true
