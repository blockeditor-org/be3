<!doctype html>
<meta charset="utf-8">
<title>Standalone plugin</title>
<link rel="icon" href="data:,">
<script type="module">
    const worker = new Worker("standalone.js", { type: "module" });
    globalThis.outcome = new Promise((resolve) => {
        worker.onmessage = ({ data }) => resolve(data);
        worker.onerror = (event) => resolve({ error: String(event.message ?? event) });
    });
    worker.postMessage({ kind: "start" });
</script>
