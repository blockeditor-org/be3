[package]
name = "be-wasm-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-wasm-gpu-abi = { path = "../be-wasm-gpu-abi" }
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }
be-wasm-guest-host = { path = "../be-wasm-guest-host" }
be-wasm-panic = { path = "../be-wasm-panic" }
be-wasm-gpu-host = { path = "../be-wasm-gpu-host" }
rustc-demangle = "0.1"
# Pinned exactly: third-party/v8/BUCK's _VERSION and its pins, and
# scripts/internal/build-rusty-v8-android.sh's version, move with it.
v8 = "=152.2.0"
getrandom = "0.3"
wasm-encoder = "0.257"
wasmparser = "0.257"
be-wasm-dylink = { path = "../be-wasm-dylink" }
be-wasm-pure-wasi = { path = "../be-wasm-pure-wasi" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
be-wasm-ops = { path = "../be-wasm-ops" }
be-wasm-guest-echo = { path = "../be-wasm-guest-echo" }
be-sdk-api = { path = "../be-sdk-api" }
be-sdk-type-api = { path = "../be-sdk-type-api" }
uuid = "1"
wat = "1"
wgpu = { version = "30", default-features = false, features = ["noop", "std", "wgsl"] }
