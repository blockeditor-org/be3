[package]
name = "block-shell"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui = { path = "../beui", default-features = false, features = ["render"] }
block-editor-beui = { path = "../block-editor-beui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings-types = { path = "../editors/settings/types" }
uuid = { version = "1", features = ["v4"] }
workspace-ui-types = { path = "../editors/workspace-ui/types" }

[lints]
workspace = true
