[package]
name = "be-block-repository"
description = "The repository and checkout blocks of version control, which the version control app and hosts read"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block-commit = { path = "../be-block-commit", default-features = false }
be-block-content = { path = "../be-block-content" }
be-block-model = { path = "../be-block-model" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
be-block-store = { path = "../be-block-store", default-features = false }

[lints]
workspace = true
