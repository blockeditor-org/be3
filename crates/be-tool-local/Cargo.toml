[package]
name = "be-tool-local"
description = "The developer and CI commands that run on this machine after a buck2 command: paint previews, deploy, fuzz, stress, rasterize, icons, web pages and APK signing"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "be-tool-local"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
beui-html = { path = "../beui-html" }
be-lib-build-id = { path = "../be-lib-build-id" }
be-lib-git = { path = "../be-lib-git" }
be-lib-sha256 = { path = "../be-lib-sha256" }
be-tool-fix-rust-source = { path = "../be-tool-fix-rust-source" }
be-tool-paint-compare = { path = "../be-tool-paint-compare" }
be-tool-paint-review-manifest = { path = "../be-tool-paint-review-manifest" }
be-tool-run-test = { path = "../be-tool-run-test" }
beui-paint-snapshot = { path = "../beui-paint-snapshot" }
serde_json = "1"
be-lib-prompt = { path = "../be-lib-prompt" }
jks = { version = "0.3", default-features = false }
p12-keystore = "0.4"
rsa = { version = "0.9", features = ["getrandom", "sha2"] }
x509-cert = { version = "0.2", features = ["builder"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
sha2 = { version = "0.10", features = ["oid"] }
be-tool-storage = { path = "../be-tool-storage" }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
