[package]
name = "beui-layer-xr"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-core = { path = "../beui-core" }
beui-types = { path = "../beui-types" }
beui-runner = { path = "../beui-runner" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
glam = "0.30"
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
wgpu = { version = "30", default-features = false }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ash = "0.38"
libloading = "0.9"
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[dev-dependencies]
beui-font-skrifa = { path = "../beui-font-skrifa" }
pollster = "0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
