[package]
name = "beui-layer-xr"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-core = { path = "../beui-core" }
beui-types = { path = "../beui-types" }
beui-runner = { path = "../beui-runner" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
glam = "0.30"
stable-hash = { path = "../stable-hash" }
wgpu = { version = "29", default-features = false }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ash = "0.38"
libloading = "0.9"
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
serde_json = "1"
wgpu = { version = "29", default-features = false, features = ["vulkan"] }

[dev-dependencies]
beui-font-freetype = { path = "../beui-font-freetype" }
pollster = "0.4"

[lints]
workspace = true
