[package]
name = "be-app-text"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beui = { path = "../beui" }
be-sdk-beui = { path = "../be-sdk-beui" }
be-sdk-text = { path = "../be-sdk-text" }
be-type-image = { path = "../be-type-image" }
serde = { version = "1", features = ["derive"] }
be-type-text = { path = "../be-type-text" }
beui-text-editor-core = { path = "../beui-text-editor-core" }
be-lib-graphemes = { path = "../be-lib-graphemes" }
be-lib-search = { path = "../be-lib-search" }
memchr = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
be-sdk-test = { path = "../be-sdk-test" }
serde_json = "1"

[lints]
workspace = true
