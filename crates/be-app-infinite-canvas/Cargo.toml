[package]
name = "be-app-infinite-canvas"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
beui = { path = "../beui" }
be-sdk-beui = { path = "../be-sdk-beui" }
be-sdk-database = { path = "../be-sdk-database" }
be-sdk-text = { path = "../be-sdk-text" }
be-sdk-ui-database = { path = "../be-sdk-ui-database" }
be-type-database = { path = "../be-type-database" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
be-type-image = { path = "../be-type-image" }
be-type-infinite-canvas = { path = "../be-type-infinite-canvas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
beui-text-editor-core = { path = "../beui-text-editor-core" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
be-tool-bench = { path = "../be-tool-bench" }
be-sdk-test = { path = "../be-sdk-test" }
be-type-example-counter = { path = "../be-type-example-counter" }

[lints]
workspace = true
