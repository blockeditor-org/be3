[package]
name = "desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beui = { path = "../../beui", default-features = false, features = ["render"] }
block-editor-beui = { path = "../../block-editor-beui" }
calendar-types = { path = "../calendar/types" }
block-shell = { path = "../../block-shell" }
uuid = { version = "1", features = ["v4"] }
workspace-ui-types = { path = "../workspace-ui/types" }

[dev-dependencies]
block-plugin-api = { path = "../../block-plugin-api" }
block-ui-test = { path = "../../block-ui-test" }

[lints]
workspace = true
