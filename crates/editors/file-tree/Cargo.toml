[package]
name = "file_tree"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
audio-block-types = { path = "../audio-block/types" }
beui = { path = "../../beui", default-features = false, features = ["render"] }
block-editor-beui = { path = "../../block-editor-beui" }
image-block-types = { path = "../image-block/types" }
pdf-types = { path = "../pdf/types" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
workspace-ui-types = { path = "../workspace-ui/types" }

[dev-dependencies]
block-ui-test = { path = "../../block-ui-test" }

[lints]
workspace = true
