[package]
name = "text_block"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beui = { path = "../../beui", default-features = false, features = ["render"] }
block-editor-beui = { path = "../../block-editor-beui" }
serde = { version = "1", features = ["derive"] }
similar = "3.1"
text-editor-core = { path = "../../text-editor-core" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
block-ui-test = { path = "../../block-ui-test" }
serde_json = "1"

[lints]
workspace = true
