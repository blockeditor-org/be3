[package]
name = "infinite_canvas"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beui = { path = "../../beui", default-features = false, features = ["render"] }
block-editor-beui = { path = "../../block-editor-beui" }
block-editor-database = { path = "../../block-editor-database" }
block-editor-text = { path = "../../block-editor-text" }
block-ui-database = { path = "../../block-ui-database" }
database-types = { path = "../database/types" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
image-block-types = { path = "../image-block/types" }
infinite-canvas-types = { path = "types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
text-editor-core = { path = "../../text-editor-core" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bench = { path = "../../bench" }
block-ui-test = { path = "../../block-ui-test" }
counter-types = { path = "../counter/types" }

[lints]
workspace = true
