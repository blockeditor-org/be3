[package]
name = "be-wasm-gpu-abi"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-wasm-ops = { path = "../be-wasm-ops" }
be-wasm-ops-bindgen = { path = "../be-wasm-ops-bindgen" }
serde = { version = "1", features = ["derive"] }
wgpu = { version = "29", default-features = false, optional = true }

[features]
# Conversions to and from the wgpu types, which the host and the guest share.
wgpu = ["dep:wgpu"]

[lints]
workspace = true
