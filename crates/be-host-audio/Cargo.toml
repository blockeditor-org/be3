[package]
name = "be-host-audio"
edition.workspace = true
version.workspace = true
license.workspace = true

# Apps' audio output, which be-host hands be-host-runtime when it installs it
# (`be_host_runtime::install`). `be` runs host components headless and plays
# nothing, so it does not take this crate, and runs where there is no ALSA.
[dependencies]
be-host-runtime = { path = "../be-host-runtime" }
be-sdk-api = { path = "../be-sdk-api" }

# rodio (via cpal) reaches ALSA/CoreAudio/WASAPI on desktop and Oboe on
# Android. The web build plays through an HTMLAudioElement, by web-sys,
# instead: cpal's own Web Audio backend only targets wasm32-unknown-unknown,
# not this project's wasm32-wasip1.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = "0.20"

# Oboe links the NDK's shared libc++, which the APK ships (buck/android/defs.bzl), rather than
# its static one: V8 brings its own libc++, whose std:: exception classes the static one would
# define again, so be-host would not link (decisions/one_cpp_runtime_beside_v8_on_android.md).
[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "EventTarget",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "Url",
] }

[lints]
workspace = true
