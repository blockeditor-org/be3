<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=resizes-content" />
        <title>beui demo</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #1b1b1b;
                color: #d0d0d0;
                font-family: system-ui, sans-serif;
            }

            #demo {
                width: 100%;
                height: 100%;
            }

            #status {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                white-space: pre-wrap;
                padding: 1rem;
            }

            #status[hidden] {
                display: none;
            }
        </style>

        <!--
            The module is built for wasm32-wasip1-threads, like block-app's, so
            its WASI calls are imports from these bare specifiers, which the
            import map points at block-app's shims.
        -->
        <script type="importmap">
            {
                "imports": {
                    "wasi_snapshot_preview1": "./wasi.js",
                    "wasi": "./threads.js"
                }
            }
        </script>
    </head>
    <body>
        <div id="demo"></div>
        <div id="status">Loading…</div>

        <script type="module">
            import { bindMemory } from "./wasi.js";
            import { bindThreads } from "./threads.js";
            import init, { run_dom } from "./beui_web_demo.js";

            const status = document.getElementById("status");
            try {
                if (!self.crossOriginIsolated) {
                    throw new Error(
                        "the page is not cross-origin isolated, so it cannot hold the module's " +
                            "shared memory; serve it with Cross-Origin-Opener-Policy: same-origin " +
                            "and Cross-Origin-Embedder-Policy: require-corp",
                    );
                }
                const module = await WebAssembly.compileStreaming(fetch("./beui_web_demo_bg.wasm"));
                const wasm = await init({ module_or_path: module });
                bindMemory(wasm.memory);
                bindThreads(module, wasm.memory);
                status.hidden = true;
                await run_dom("demo", "./icons.ttf");
            } catch (error) {
                console.error(error);
                status.hidden = false;
                status.textContent = `The demo could not start.\n\n${error}`;
            }
        </script>
    </body>
</html>
