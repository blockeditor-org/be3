[package]
name = "block-app"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[lib]
name = "block_app_lib"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "block-app"
path = "src/desktop.rs"

[package.metadata.android]
package = "com.be3.block"
apk_name = "block-app"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.signing.dev]
path = "../../target/android-debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "Block"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
exported = true

[dependencies]
# The block stack. The app is a peer of it on every platform: be-client's socket
# and executor come from its own transport/.
be-block = { path = "../be-block" }
be-client = { path = "../be-client" }
be-keys = { path = "../be-keys" }
be-commit = { path = "../be-commit" }
be-graph = { path = "../be-graph" }
be-protocol = { path = "../be-protocol" }
be-session = { path = "../be-session" }
beui = { path = "../beui" }
block-app-base = { path = "../block-app-base" }
block-app-stack = { path = "../block-app-stack" }
block-accounts-ui = { path = "../block-accounts-ui" }
block-guest-host = { path = "../block-guest-host" }
block-plugin-api = { path = "../block-plugin-api" }
block-plugin-manifest = { path = "../block-plugin-manifest" }
# Block types run as type modules: the replica library for the types the app
# applies itself, which run in process, and the protocol of every module.
block-type-api = { path = "../block-type-api" }
block-type-guest = { path = "../block-type-guest" }
be-types-host = { path = "../be-types-host" }
build-id = { path = "../build-id" }
bytemuck = { version = "1.24.0", features = ["derive"] }
futures-util = { version = "0.3", features = ["io"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
reactive = { path = "../reactive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the synchronisation primitives are shared with the browser build; the
# new block stack's worker gets its executor and its timer from be/ instead.
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
wasi-threads = { path = "../wasi-threads" }
wgpu = { version = "29", default-features = false }

# Desktop and Android. The web build has no embedded server and no blocking
# HTTP client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The wasmtime plugin host, which runs every plugin on every platform but the
# browser. The browser runs the same wasm in a worker of its own.
beui-host = { path = "../beui-host" }
block-wasm-host = { path = "../block-wasm-host" }
directories-next = "2"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
# rodio (via cpal) reaches ALSA/CoreAudio/WASAPI on desktop and Oboe on
# Android. The web build talks to the Web Audio API through web-sys directly
# instead: cpal's own Web Audio backend only targets wasm32-unknown-unknown,
# not this project's wasm32-wasip1 (see editors/audio/playback.rs).
rodio = "0.20"

# Desktop only: Android has no embedded browser, and the browser sandbox has
# none either.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The Windows host's mapping to the desktop's types, tested everywhere.
be-win32 = { path = "../be-win32" }
# The block stack with the plugins' type modules in process, and the types the
# tests name the blocks of.
block-app-testing = { path = "../block-app-testing" }
calendar-types = { path = "../editors/calendar/types" }
counter-types = { path = "../editors/counter/types" }
browser-tab-types = { path = "../editors/browser-tab/types" }
database-types = { path = "../editors/database/types" }
text-block-types = { path = "../editors/text-block/types" }
pollster = "0.4"
paint-snapshot = { path = "../paint-snapshot" }
block-ui-test = { path = "../block-ui-test" }

# Linux runs the app as a Wayland compositor, and --session runs it on the
# displays and input devices themselves rather than in a window.
[target.'cfg(target_os = "linux")'.dependencies]
block-app-services = { path = "../block-app-services" }
be-dmabuf = { path = "../be-dmabuf" }
be-wayland = { path = "../be-wayland" }
be-remap-host = { path = "../remap/host" }
beui-platform-drm = { path = "../beui-platform-drm" }
# Files a block is written to for a program to open are watched, so what the
# program saves is taken back into the block.
notify = "8"
pollster = "0.4"
zbus = { version = "5", default-features = false, features = ["async-io"] }

# Windows's monitors and windows are captured onto the app's own Vulkan device.
[target.'cfg(windows)'.dependencies]
be-win32 = { path = "../be-win32" }
be-win32-capture = { path = "../be-win32-capture" }
be-win32-input = { path = "../be-win32-input" }

[target.'cfg(all(unix, not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-host = { path = "../beui-host", default-features = false, features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "ImageBitmap",
    "Location",
    "MessageEvent",
    "Node",
    "OffscreenCanvas",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "WorkerOptions",
    "WorkerType",
    "console",
] }

[lints]
workspace = true
