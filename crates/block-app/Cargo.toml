[package]
name = "block-app"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[lib]
name = "block_app_lib"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "block-app"
path = "src/desktop.rs"

[package.metadata.android]
package = "com.be3.block"
apk_name = "block-app"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.signing.dev]
path = "../../target/android-debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "Block"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
exported = true

[features]
# Two features rather than one, because what they cost to set up is different:
# the terminal needs a Zig toolchain and a Ghostty checkout before cargo can
# link anything at all, and the embedded browser only needs a large dependency
# tree. Neither is on by default, so a plain cargo build works without either
# prerequisite. buck2, which is what builds the app, always turns both on.
default = []
terminal = ["dep:ghostty-vt"]
web-view = ["dep:wry"]
full = ["terminal", "web-view"]

[dependencies]
# The block stack. The app is a peer of it on every platform: be-client's socket
# and executor come from its own transport/.
be-block = { path = "../be-block" }
be-client = { path = "../be-client" }
be-graph = { path = "../be-graph" }
be-protocol = { path = "../be-protocol" }
be-store = { path = "../be-store" }
beui = { path = "../beui", default-features = false, features = ["render"] }
block-plugin-api = { path = "../block-plugin-api" }
bytemuck = { version = "1.24.0", features = ["derive"] }
game-host = { path = "../tabletop_games/host" }
ghostty-vt = { path = "../ghostty-vt", optional = true }
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
logicgame = { path = "../logicgame" }
reactive = { path = "../reactive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the synchronisation primitives are shared with the browser build; the
# new block stack's worker gets its executor and its timer from be/ instead.
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
wasi-threads = { path = "../wasi-threads" }
wgpu = { version = "29", default-features = false }

# Desktop and Android. The web build has no embedded server, no SQLite file to
# put app state in, and no blocking HTTP client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The wasmtime plugin host, which runs every plugin on every platform but the
# browser. The browser runs the same wasm in a worker of its own.
be-server = { path = "../be-server" }
beui = { path = "../beui", features = ["window"] }
block-wasm-host = { path = "../block-wasm-host" }
directories-next = "2"
winit = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
ureq = { version = "2", features = ["gzip"] }
# rodio (via cpal) reaches ALSA/CoreAudio/WASAPI on desktop and Oboe on
# Android. The web build talks to the Web Audio API through web-sys directly
# instead: cpal's own Web Audio backend only targets wasm32-unknown-unknown,
# not this project's wasm32-wasip1 (see editors/audio/playback.rs).
rodio = "0.20"

# Desktop only: Android has neither an embedded browser nor an image clipboard,
# and the browser sandbox has neither.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
arboard = "3.6"
# The native file dialog. Android and the browser reach their own pickers
# instead, from platform/file_picker.rs.
rfd = "0.15"
wry = { version = "0.57.0", optional = true }

# The plugin side of the protocol, for the tests that check the host only sends
# a plugin's session messages it accepts. Nothing in the app links it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
block-editor-plugin = { path = "../block-editor-plugin" }

[target.'cfg(all(unix, not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
winit = { version = "0.30.13", features = ["android-game-activity"] }
# Used by the version-switching debug window to build the ContentResolver /
# Intent calls that download and install a GitHub Actions build.
jni = "0.22"
ndk-context = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui = { path = "../beui", default-features = false, features = ["web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "MessageEvent",
    "Node",
    "OffscreenCanvas",
    "Performance",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "console",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
