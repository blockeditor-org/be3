[package]
name = "be-wasm-gpu-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-wasm-gpu-abi = { path = "../be-wasm-gpu-abi", features = ["wgpu"] }
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }

[lints]
workspace = true

[dev-dependencies]
be-wasm-ops = { path = "../be-wasm-ops" }
wgpu = { version = "29", default-features = false, features = ["noop", "std", "wgsl"] }
