[package]
name = "beui-html-spike"
description = "block-app's account picker on beui's HTML core: prerendered on the host, hydrated in the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "beui-html-spike"
path = "src/main.rs"

[dependencies]
beui = { path = "../beui" }
block-accounts-ui = { path = "../block-accounts-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-threads = { path = "../wasi-threads" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
paint-snapshot = { path = "../paint-snapshot" }

[lints]
workspace = true
