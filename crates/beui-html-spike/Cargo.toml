[package]
name = "beui-html-spike"
description = "be-host's account picker on beui's HTML core: prerendered on the host, hydrated in the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "beui-html-spike"
path = "src/main.rs"

[dependencies]
beui = { path = "../beui" }
be-host-accounts-ui = { path = "../be-host-accounts-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
be-wasm-threads = { path = "../be-wasm-threads" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
beui-paint-snapshot = { path = "../beui-paint-snapshot" }

[lints]
workspace = true
