be-lib-geometry = { path = "../be-lib-geometry" }
serde = { version = "1", features = ["derive", "rc"] }
be-lib-ui-keys = { path = "../be-lib-ui-keys" }
be-lib-ui-preferences = { path = "../be-lib-ui-preferences" }

[lints]
workspace = true
