[package]
name = "be-app-logic-grid"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
beui = { path = "../beui" }
be-sdk-beui = { path = "../be-sdk-beui" }
bytemuck = { version = "1", features = ["derive"] }
be-type-logic-grid = { path = "../be-type-logic-grid" }
logicgame = { path = "../logicgame" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
be-sdk-test = { path = "../be-sdk-test" }

[lints]
workspace = true
