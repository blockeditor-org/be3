[package]
name = "be-wasm-root-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-wasm-guest-host = { path = "../be-wasm-guest-host" }
be-wasm-ops = { path = "../be-wasm-ops" }
be-wasm-root-api = { path = "../be-wasm-root-api" }
be-wasm-sandbox-api = { path = "../be-wasm-sandbox-api" }
be-wasm-sandbox-host = { path = "../be-wasm-sandbox-host" }

# V8, which runs the root natively. The browser runs it on the page instead
# (src/web.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
be-wasm-host = { path = "../be-wasm-host" }
wgpu = { version = "29", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "Response",
    "Window",
] }

[dev-dependencies]
be-lib-layers = { path = "../be-lib-layers" }
be-wasm-dylink = { path = "../be-wasm-dylink" }
be-wasm-guest-echo = { path = "../be-wasm-guest-echo" }
be-wasm-root-testing = { path = "../be-wasm-root-testing" }
wat = "1"
wgpu = { version = "29", default-features = false, features = ["noop"] }

[lints]
workspace = true
