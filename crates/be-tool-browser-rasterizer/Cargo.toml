[package]
name = "be-tool-browser-rasterizer"
description = "On-demand Chromium rendering of browser paint snapshots, over the DevTools protocol"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "browser-rasterizer"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
beui-fonts = { path = "../beui-fonts" }
beui-paint-snapshot = { path = "../beui-paint-snapshot" }
libc = "0.2"
serde_json = "1"
url = "2"

[lints]
workspace = true
