[package]
name = "be-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
be-portal = { path = "../be-portal" }
argon2 = "0.5"
chacha20poly1305 = "0.10"
be-block = { path = "../be-block" }
be-commit = { path = "../be-commit" }
be-graph = { path = "../be-graph" }
be-keys = { path = "../be-keys" }
be-protocol = { path = "../be-protocol" }
be-session = { path = "../be-session" }
be-store = { path = "../be-store" }
build-id = { path = "../build-id" }
futures-util = "0.3"
httparse = "1"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlite-schema = { path = "../sqlite-schema" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.23"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.23"
