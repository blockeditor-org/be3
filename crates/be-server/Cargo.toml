[package]
name = "be-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
be-server-portal = { path = "../be-server-portal" }
argon2 = "0.5"
chacha20poly1305 = "0.10"
be-block = { path = "../be-block" }
be-block-commit = { path = "../be-block-commit" }
be-block-graph = { path = "../be-block-graph" }
be-block-keys = { path = "../be-block-keys" }
be-wasm-ops = { path = "../be-wasm-ops" }
be-block-protocol = { path = "../be-block-protocol" }
be-block-session = { path = "../be-block-session" }
be-block-store = { path = "../be-block-store" }
be-lib-build-id = { path = "../be-lib-build-id" }
futures-util = "0.3"
httparse = "1"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
be-block-sqlite-schema = { path = "../be-block-sqlite-schema" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.23"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.23"
