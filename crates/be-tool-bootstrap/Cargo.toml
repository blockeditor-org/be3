[package]
name = "be-tool-bootstrap"
description = "What every script in scripts/ runs: buck2 and its build server, and the commands around it"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
be-lib-crate-pins = { path = "../be-lib-crate-pins" }
be-lib-prompt = { path = "../be-lib-prompt" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }

[lints]
workspace = true
