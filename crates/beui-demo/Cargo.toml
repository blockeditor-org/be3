[package]
name = "beui-demo"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
beui = { path = "../beui" }
beui-macros = { path = "../beui-macros" }
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
beui-text-editor-core = { path = "../beui-text-editor-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beui-host = { path = "../beui-host" }

[dev-dependencies]
be-tool-bench = { path = "../be-tool-bench" }
beui-host = { path = "../beui-host", default-features = false }
beui-inspector = { path = "../beui-inspector" }
be-sdk-test = { path = "../be-sdk-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-core = { path = "../beui-core" }
beui-runner = { path = "../beui-runner" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
pollster = "0.4"

[lints]
workspace = true

[[example]]
name = "open-bench"

[[example]]
name = "space-bench"
