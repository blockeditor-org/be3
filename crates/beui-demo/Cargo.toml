[package]
name = "beui-demo"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "demo"
path = "src/main.rs"

[features]
default = ["native"]
# The demo's shell and the pages that only the native core can show: docking,
# the on-screen keyboard and the inspector. beui-demo-html builds without it.
native = []

[dependencies]
beui = { path = "../beui", default-features = false }
beui_macros = { path = "../beui-macros" }
text-editor-core = { path = "../text-editor-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beui = { path = "../beui" }

[dev-dependencies]
bench = { path = "../bench" }
beui-inspector = { path = "../beui-inspector" }
block-ui-test = { path = "../block-ui-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-core = { path = "../beui-core" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
pollster = "0.4"

[lints]
workspace = true

[[example]]
name = "open-bench"

[[example]]
name = "space-resize-bench"

[[example]]
name = "space-cursor-bench"
