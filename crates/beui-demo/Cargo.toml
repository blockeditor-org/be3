[package]
name = "beui-demo"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
beui = { path = "../beui" }
beui_macros = { path = "../beui-macros" }
stable-hash = { path = "../stable-hash" }
text-editor-core = { path = "../text-editor-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beui-host = { path = "../beui-host" }

[dev-dependencies]
bench = { path = "../bench" }
beui-host = { path = "../beui-host", default-features = false }
beui-inspector = { path = "../beui-inspector" }
block-ui-test = { path = "../block-ui-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
beui-layer-space = { path = "../beui-layer-space" }
beui-core = { path = "../beui-core" }
beui-runner = { path = "../beui-runner" }
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
pollster = "0.4"

[lints]
workspace = true

[[example]]
name = "open-bench"

[[example]]
name = "space-resize-bench"

[[example]]
name = "space-cursor-bench"
