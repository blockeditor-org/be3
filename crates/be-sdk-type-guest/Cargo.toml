[package]
name = "be-sdk-type-guest"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block = { path = "../be-block" }
be-block-commit = { path = "../be-block-commit", default-features = false }
be-wasm-ops = { path = "../be-wasm-ops" }
be-block-protocol = { path = "../be-block-protocol" }
be-block-session = { path = "../be-block-session", default-features = false }
be-block-store = { path = "../be-block-store", default-features = false }
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }
be-sdk-type-api = { path = "../be-sdk-type-api" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }

# A pure guest has no entropy of its own: ids come from a generator its host
# seeds (Event::Entropy), behind getrandom's custom backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = "0.4"
rand_chacha = { version = "0.9", default-features = false }
uuid = { version = "1", features = ["rng-getrandom"] }

[dev-dependencies]
be-block-model = { path = "../be-block-model" }
be-block-store = { path = "../be-block-store" }
pollster = "0.4"

[lints]
workspace = true
