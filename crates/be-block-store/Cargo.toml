[package]
name = "be-block-store"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["vault"]
# Sealing and opening content, which a pure guest does without.
vault = ["dep:be-block-keys", "dep:rand"]

[dependencies]
be-block-keys = { path = "../be-block-keys", optional = true }
be-lib-cbor = { path = "../be-lib-cbor" }
ciborium = "0.2"
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[lints]
workspace = true
