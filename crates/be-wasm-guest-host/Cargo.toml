[package]
name = "be-wasm-guest-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-wasm-guest-abi = { path = "../be-wasm-guest-abi" }

# The browser runs a guest in a web worker of its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "MessageEvent",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[dev-dependencies]
be-wasm-guest-echo = { path = "../be-wasm-guest-echo" }

[lints]
workspace = true
