[package]
name = "be-tool-launcher"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "be-launcher"
path = "src/main.rs"

[dependencies]
be-block = { path = "../be-block" }
beui = { path = "../beui" }
beui-host = { path = "../beui-host" }
comrak = { version = "0.55", default-features = false }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
be-tool-terminal-emulator = { path = "../be-tool-terminal-emulator" }
be-type-terminal = { path = "../be-type-terminal" }
beui-terminal-view = { path = "../beui-terminal-view" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
ureq = "2"

[dev-dependencies]
be-sdk-test = { path = "../be-sdk-test" }

[lints]
workspace = true
