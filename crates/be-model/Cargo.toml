[package]
name = "be-model"
description = "Block content built from primitives that merge, rebase and undo themselves"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-commit = { path = "../be-commit", default-features = false }
be-model-derive = { path = "../be-model-derive" }
be-store = { path = "../be-store", default-features = false }
ciborium = "0.2"
postcard = { version = "1", features = ["use-std"] }
sequence = { path = "../sequence" }
serde = { version = "1", features = ["derive", "rc"] }
uuid = { version = "1", features = ["serde", "v4"] }

[features]
fuzzing = []

[lints]
workspace = true
