[package]
name = "beui-core-html"
description = "beui's HTML core: the base components as real DOM elements that the browser lays out, focuses and selects"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
accesskit = "0.24.1"
base64 = "0.22"
beui-fonts = { path = "../beui-fonts" }
beui-html = { path = "../beui-html" }
beui-tree = { path = "../beui-tree" }
beui-types = { path = "../beui-types" }
png = "0.18"
reactive = { path = "../reactive" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ttf-parser = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-web-input = { path = "../beui-web-input" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Url",
    "CanvasRenderingContext2d",
    "DomRectList",
    "HtmlCanvasElement",
    "Range",
    "TextMetrics",
    "ClipboardEvent",
    "DataTransfer",
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "FontFaceSet",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "MediaQueryList",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "Node",
    "Performance",
    "ResizeObserver",
    "Selection",
    "Window",
] }

[lints]
workspace = true
