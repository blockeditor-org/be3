[package]
name = "block-accounts-ui"
description = "block-app's account picker, built from props and callbacks so that it runs on either of beui's cores"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui = { path = "../beui" }

[dev-dependencies]
paint-snapshot = { path = "../paint-snapshot" }

[target.'cfg(not(beui_html))'.dev-dependencies]
beui-host = { path = "../beui-host", default-features = false }

[lints]
workspace = true
