[package]
name = "be-server-portal-ui"
description = "be-server's account portal on beui's HTML core: rendered on the server, hydrated in the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
be-server-portal = { path = "../be-server-portal" }
beui = { path = "../beui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
be-wasm-threads = { path = "../be-wasm-threads" }
wasm-bindgen = "0.2"

[dev-dependencies]
beui-paint-snapshot = { path = "../beui-paint-snapshot" }

[lints]
workspace = true
