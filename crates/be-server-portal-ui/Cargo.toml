[package]
name = "be-server-portal-ui"
description = "be-server's account portal on beui's HTML core: rendered on the server, hydrated in the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
be-server-portal = { path = "../be-server-portal" }
beui = { path = "../beui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
be-wasm-threads = { path = "../be-wasm-threads" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "CredentialsContainer",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "Navigator",
    "Node",
    "Window",
] }

[dev-dependencies]
beui-paint-snapshot = { path = "../beui-paint-snapshot" }

[lints]
workspace = true
