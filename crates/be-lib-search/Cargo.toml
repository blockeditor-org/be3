[package]
name = "be-lib-search"
description = "A full-text index kept as immutable segments of bytes, read by range"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-lib-graphemes = { path = "../be-lib-graphemes" }
caseless = "0.2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[lints]
workspace = true
