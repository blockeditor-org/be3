[package]
name = "be-tool-drive"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "be-drive"
path = "src/main.rs"

[dependencies]
be-host-archive = { path = "../be-host-archive" }
beui-runner = { path = "../beui-runner" }
beui-layer-drive = { path = "../beui-layer-drive" }
