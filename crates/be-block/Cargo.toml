[package]
name = "be-block"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-commit = { path = "../be-commit", default-features = false }
be-graph = { path = "../be-graph" }
be-model = { path = "../be-model" }
be-store = { path = "../be-store", default-features = false }
memchr = "2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
ui-preferences = { path = "../ui-preferences" }
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true

