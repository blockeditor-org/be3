[package]
name = "beui-components-styled"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
gpu = ["dep:beui-core", "dep:beui-draw", "dep:bytemuck", "dep:wgpu"]

[dependencies]
accesskit = "0.24.1"
beui-components-unstyled = { path = "../beui-components-unstyled" }
beui-view = { path = "../beui-view" }
beui-macros = { path = "../beui-macros" }
beui-reactive = { path = "../beui-reactive" }
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
beui-text-editor-core = { path = "../beui-text-editor-core" }

[target.'cfg(not(beui_html))'.dependencies]
beui-core = { path = "../beui-core", optional = true }
beui-draw = { path = "../beui-draw", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"], optional = true }

[lints]
workspace = true
