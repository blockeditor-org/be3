[package]
name = "beui-platform-drm"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-lib-dmabuf = { path = "../be-lib-dmabuf" }
beui = { path = "../beui" }
beui-host = { path = "../beui-host", default-features = false }
beui-core = { path = "../beui-core" }
beui-types = { path = "../beui-types" }
beui-runner = { path = "../beui-runner" }
rustix = { version = "1", features = ["event"] }
smithay = { version = "0.7", default-features = false, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev"] }
be-lib-stable-hash = { path = "../be-lib-stable-hash" }
be-lib-ui-types = { path = "../be-lib-ui-types" }
wgpu = { version = "29", default-features = false, features = ["vulkan"] }

[dev-dependencies]
beui-paint-snapshot = { path = "../beui-paint-snapshot" }

[lints]
workspace = true
