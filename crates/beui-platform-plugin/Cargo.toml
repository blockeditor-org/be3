[package]
name = "beui-platform-plugin"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beui-core = { path = "../beui-core" }
beui-types = { path = "../beui-types" }
beui-runner = { path = "../beui-runner" }
beui-font-freetype = { path = "../beui-font-freetype" }
beui-host = { path = "../beui-host", default-features = false }
beui-platform-plugin-api = { path = "../beui-platform-plugin-api" }
block-editor-plugin = { path = "../block-editor-plugin" }
block-plugin-api = { path = "../block-plugin-api" }
stable-hash = { path = "../stable-hash" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
beui-renderer-wgpu = { path = "../beui-renderer-wgpu" }
wgpu = { version = "29", default-features = false }

[dev-dependencies]
beui = { path = "../beui" }

[lints]
workspace = true
