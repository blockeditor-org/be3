[package]
name = "be-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
be-block = { path = "../be-block" }
be-commit = { path = "../be-commit" }
be-graph = { path = "../be-graph" }
be-protocol = { path = "../be-protocol" }
be-session = { path = "../be-session" }
be-store = { path = "../be-store" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# Only the synchronisation primitives are shared with the browser build: they
# carry no runtime of their own, and the socket and the executor come from
# transport/ instead.
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

[dev-dependencies]
be-server = { path = "../be-server" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
