manifest_path = "Cargo.toml"
third_party_dir = "third-party/rust"
vendor = false
cargo_env = true

# The platforms the third-party rules are resolved for. The names are not free:
# prelude//rust:cargo_package.bzl maps a buck2 configuration to one of these
# strings, so "wasi" is os:wasi + cpu:wasm32 and "wasm32" is os:none + the same
# cpu. buck/platforms/BUCK defines the two target platforms that land on them.
#
# execution-platform says which of them a build script or a proc macro runs on.
# Only the host does; without saying so, a feature a build script turns on
# would be turned on for the wasm targets as well.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true
# The workspace's features on the host: each crate's defaults, and block-app's
# full, which is the terminal and the embedded browser. reindeer would
# otherwise resolve from the defaults alone, and neither of those is one.
# buck/cargo/buckify.bxl asks cargo to plan the same build.
features = ["default", "full"]

# The cross-compiled platforms, with the host's features. The names are the
# prelude's, but for Windows, which the prelude names by ABI rather than by
# architecture and which differs by architecture here: windows-targets links a
# different crate of import libraries for each.
[platform.android-arm64]
target = "aarch64-linux-android"
execution-platform = false
features = ["default", "full"]

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = false
features = ["default", "full"]

[platform.macos-arm64]
target = "aarch64-apple-darwin"
execution-platform = false
features = ["default", "full"]

[platform.macos-x86_64]
target = "x86_64-apple-darwin"
execution-platform = false
features = ["default", "full"]

[platform.windows-arm64]
target = "aarch64-pc-windows-msvc"
execution-platform = false
features = ["default", "full"]

[platform.windows-x86_64]
target = "x86_64-pc-windows-msvc"
execution-platform = false
features = ["default", "full"]

# block-app's web bundle. WASI with threads, which is what the browser's
# half of crates/block-app/web gives it, with the app's full, as on the host.
[platform.wasi]
target = "wasm32-wasip1-threads"
execution-platform = false
features = ["default", "full"]

# The plugins. The same triple as above, because it is the same triple:
# what tells them apart is the plugin_guest cfg, which nothing but this file and
# the fixups keyed on it know about. Cargo resolves both the same way; the
# fixups are what then give wgpu and egui-wgpu the guest's feature set rather
# than the app's. buck/constraints/BUCK says why that is necessary, and the root
# PACKAGE file is what maps a buck2 configuration onto this name.
[platform.wasi-guest]
target = "wasm32-wasip1-threads"
execution-platform = false
plugin_guest = ["true"]

# The games, and the browser's half of the plugin protocol.
[platform.wasm32]
target = "wasm32-unknown-unknown"
execution-platform = false

[buck]
file_name = "BUCK"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"
# With more than one platform an alias has to say which of them it exists on,
# which the prelude's own alias does and buck2's builtin one does not.
alias_with_platforms = "cargo_alias"
buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
load("@prelude//rust:cargo_package.bzl", cargo_alias = "alias")
"""
generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand.
##
## Run ./scripts/buck run //:buckify after changing any Cargo.toml.
##
"""
