# Cargo builds one wgpu for the crate and its tests together, so a feature a
# dev-dependency asks for is on in both. Buck builds one target per rule and
# does not unify, so the feature the tests need is named here.
buildscript.run = true
['cfg(not(target_family = "wasm"))']
features = ["noop"]

# The two wasm builds, which are the same triple and want different wgpu.
#
# block-app's web bundle draws to the page and links a real browser backend. It
# cannot have custom as well: the custom backend keeps its handles behind trait
# objects that are neither Send nor Sync, and with fragile-send-sync-non-atomic-
# wasm on - which is what the app has, on a target whose cfg carries no
# "atomics" - wgpu asserts that they are both.
['cfg(all(target_family = "wasm", not(plugin_guest)))']
omit_features = ["custom"]

# A plugin is a guest: it reaches the host's device through the gpu abi and
# carries no backend of its own, which is the set eframe's
# wgpu_no_default_features leaves it under cargo. Everything omitted here is the
# app's, and reaches this platform because reindeer resolves one feature set per
# platform across the whole workspace.
['cfg(plugin_guest)']
omit_features = [
  "default",
  "dx12",
  "fragile-send-sync-non-atomic-wasm",
  "gles",
  "metal",
  "noop",
  "parking_lot",
  "vulkan",
  "webgl",
  "webgpu",
  "wgpu-core",
]
