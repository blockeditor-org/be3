# The build script compiles src/lib.c, which #includes the rest of src/*.c, and
# the archive it produces is not something Buck can link: the prelude drops the
# -L and -l flags a build script asks for. So the C is built here instead, and
# the build script is still run for the sources it puts in OUT_DIR.
buildscript.run = true

[[cxx_library]]
name = "tree-sitter"
srcs = ["src/lib.c"]
headers = ["src/**/*.h", "src/**/*.c", "include/**/*.h"]
include_paths = ["src", "src/wasm", "include"]
compiler_flags = [
  "-std=c11",
  "-w",
  "-fvisibility=hidden",
  "-D_POSIX_C_SOURCE=200112L",
  "-D_DEFAULT_SOURCE",
  "-D_BSD_SOURCE",
  "-D_DARWIN_C_SOURCE",
]
