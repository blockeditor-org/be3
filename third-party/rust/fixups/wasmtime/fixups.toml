# The same as wasmi's: block-wasm-host's tests hand the host modules written as
# text, and under cargo the dev-dependency that asks for wat turns it on for the
# library too. wasmtime is host-only, so there is no platform to exclude.
features = ["wat"]
# The feature is an optional dependency, and a feature named in a fixup does
# not pull one in: reindeer resolved the graph before reading this.
extra_deps = ["//third-party/rust:wat"]

# One C file, for the signal handler trampolines the runtime needs.
buildscript.run = true

[[cxx_library]]
name = "helpers"
srcs = ["src/runtime/vm/helpers.c"]
compiler_flags = [
  "-w",
  "-DCFG_TARGET_OS_linux",
  "-DCFG_TARGET_ARCH_x86_64",
  "-DVERSIONED_SUFFIX=_48_0_1",
]
