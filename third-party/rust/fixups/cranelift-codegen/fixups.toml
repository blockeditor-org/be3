buildscript.run = true

# The arm64 backend beside the host's own, on the host. The plugins an APK
# carries are compiled for the device's wasmtime ahead of time, on the machine
# that builds it - crates/block-app's android-assets - which cargo's Android
# build did with a precompiler built with block-wasm-host's all-arch. buck2
# builds one wasmtime for the host, so it is this one that has to know arm64.
['cfg(all(target_arch = "x86_64", target_os = "linux"))']
features = ["arm64"]
