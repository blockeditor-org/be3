# zstd is vendored in the crate and compiled by its build script. The prelude
# drops the link flags a build script asks for, so the C is built here.
buildscript.run = true

[[cxx_library]]
name = "zstd"
srcs = [
  "zstd/lib/common/*.c",
  "zstd/lib/compress/*.c",
  "zstd/lib/decompress/*.c",
  "zstd/lib/decompress/*.S",
  "zstd/lib/dictBuilder/*.c",
  "zstd/lib/legacy/*.c",
]
headers = ["zstd/lib/**/*.h", "*.h"]
include_paths = ["zstd/lib", "zstd/lib/common", "zstd/lib/legacy"]
compiler_flags = [
  "-w",
  "-fvisibility=hidden",
  "-DZSTD_LIB_DEPRECATED=0",
  "-DXXH_PRIVATE_API=",
  "-DZSTDLIB_VISIBILITY=",
  "-DZDICTLIB_VISIBILITY=",
  "-DZSTDERRORLIB_VISIBILITY=",
  "-DZSTD_LEGACY_SUPPORT=1",
]
