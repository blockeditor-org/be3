# With the game-activity feature the build script compiles the GameActivity
# glue the crate vendors. Buck does not link what a build script builds, so the
# same files are compiled here instead, and the build script is not run.
buildscript.run = false

[['cfg(target_os = "android")'.cxx_library]]
name = "game-activity"
srcs = [
  "android-games-sdk/src/common/system_utils.cpp",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/src/game-activity/GameActivity.cpp",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/src/game-activity/GameActivityEvents.cpp",
  "android-games-sdk/game-text-input/prefab-src/modules/game-text-input/src/game-text-input/gametextinput.cpp",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/src/game-activity/native_app_glue/android_native_app_glue.c",
]
headers = ["android-games-sdk/**/*.h"]
include_paths = [
  "android-games-sdk/src/common",
  "android-games-sdk/include",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/include",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/include/game-activity",
  "android-games-sdk/game-activity/prefab-src/modules/game-activity/src/game-activity",
  "android-games-sdk/game-text-input/prefab-src/modules/game-text-input/include",
]
compiler_flags = ["-w"]
# The glue is C++, and what links it is a Rust library, which brings no C++
# runtime of its own; on Android this is the libc++_shared.so the APK carries.
deps = ["//third-party/system:stdc++"]
