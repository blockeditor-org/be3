# The text-changed event, ported from Flutter, counts back from len() - 1 as a
# signed index and relies on an empty string's wrapping to -1. With overflow
# checks, as in a debug build, that subtraction panics on a Java thread and
# aborts the app, so the crate wraps as it does in a release build.
rustc_flags = ["-Coverflow-checks=off"]
